name: Verify dist

# Proves the committed dist/ tree is what manifests/cluster/ renders to, that
# every image in it is digest-pinned, and that data-bearing objects cannot be
# pruned.
#
# This workflow is read-only by design. It renders into a scratch tree, compares
# it with dist/, and fails. It never commits, so it introduces no second writer
# to main alongside release.yaml and generate-apps.yml, and it needs no secret.
# No job here contacts a container registry: every image is already pinned, so
# rendering resolves nothing.
# Runs on every pull request rather than a path filter: `main` requires this
# check, and a pull request that does not produce it can never merge.
on:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: dist-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'

      - name: Install pinned tooling
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source scripts/tools.env

          python -m pip install --disable-pip-version-check "PyYAML==${PYAML_VERSION}"

          base="https://github.com/kubernetes-sigs/kustomize/releases/download"
          archive="kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          url="${base}/kustomize%2Fv${KUSTOMIZE_VERSION}/${archive}"
          curl -fsSL --retry 3 -o "/tmp/${archive}" "${url}"
          # Verify against the release checksums rather than trusting the download.
          curl -fsSL --retry 3 -o /tmp/kustomize-checksums.txt \
            "${base}/kustomize%2Fv${KUSTOMIZE_VERSION}/checksums.txt"
          ( cd /tmp && grep " ${archive}\$" kustomize-checksums.txt | sha256sum -c - )
          tar -xzf "/tmp/${archive}" -C /tmp kustomize
          install -m 0755 /tmp/kustomize /usr/local/bin/kustomize
          kustomize version

      - name: Render and compare
        run: |
          set -euo pipefail
          ./scripts/render-dist.sh --check

      - name: Assert every image is pinned and no object was lost
        run: |
          set -euo pipefail
          ./scripts/verify-dist.py --report

      - name: Assert data-bearing objects cannot be pruned
        run: |
          set -euo pipefail
          # Explicit, separate step so a failure names the property that broke
          # rather than surfacing as one line inside verify-dist's report.
          ./scripts/verify-dist.py --check-protected
