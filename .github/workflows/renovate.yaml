name: Renovate

# Self-hosted Renovate, not the Mend app.
#
# The reason is `postUpgradeTasks` in renovate.json: Renovate runs
# ./scripts/render-dist.sh before it commits, so a version bump arrives with
# manifests/dist/ already regenerated and `dist-verify` green. postUpgradeTasks
# is a self-hosted-only feature, and without it every Renovate PR would fail
# dist-verify until a human re-rendered the tree.
#
# Running the CLI on the runner rather than the renovate action container is
# deliberate: the container does not carry kustomize, and a version other than
# the one pinned in scripts/tools.env re-serialises the whole rendered tree, so
# the PR would not match what CI renders.
#
# Authentication is a GitHub App installation token, minted per run, rather than
# a long-lived PAT. Two constraints it must satisfy:
#   - pull requests it opens DO trigger workflows. GITHUB_TOKEN does not, so
#     dist-verify would never run on a Renovate PR and the merge gate would
#     silently disappear.
#   - the App needs Workflows: write, because Renovate bumps the `uses:` pins in
#     this directory and GitHub rejects a push touching .github/workflows/**
#     without it.
on:
  schedule:
    # Weekly. A homelab does not need faster, and a slower cadence keeps the
    # review queue short enough to actually read.
    - cron: "0 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

env:
  RENOVATE_VERSION: 44.257.9

jobs:
  renovate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The token is an environment secret, not a repository secret, so a
    # pull_request job cannot read a write-capable credential. The environment's
    # branch policy allows `main` only; it has no required reviewers on purpose,
    # because those would stall every scheduled run.
    environment: renovate
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned kustomize
        # Must match scripts/tools.env exactly; render-dist.sh refuses to run
        # otherwise, and a mismatch would re-serialise every file in dist/.
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source scripts/tools.env

          base="https://github.com/kubernetes-sigs/kustomize/releases/download"
          archive="kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          url="${base}/kustomize%2Fv${KUSTOMIZE_VERSION}/${archive}"
          curl -fsSL --retry 3 -o "/tmp/${archive}" "${url}"
          curl -fsSL --retry 3 -o /tmp/kustomize-checksums.txt \
            "${base}/kustomize%2Fv${KUSTOMIZE_VERSION}/checksums.txt"
          ( cd /tmp && grep " ${archive}\$" kustomize-checksums.txt | sha256sum -c - )
          tar -xzf "/tmp/${archive}" -C /tmp kustomize
          install -m 0755 /tmp/kustomize /usr/local/bin/kustomize
          kustomize version

      - name: Install pinned helm and helmfile
        # The chart render has to reproduce what `task helm` produces locally, so
        # both tools come from scripts/tools.env and are checksum-verified. A
        # different helm re-serialises the whole chart.
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source scripts/tools.env

          helm_archive="helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          curl -fsSL --retry 3 -o "/tmp/${helm_archive}" "https://get.helm.sh/${helm_archive}"
          curl -fsSL --retry 3 -o /tmp/helm.sha256sum "https://get.helm.sh/${helm_archive}.sha256sum"
          ( cd /tmp && sha256sum -c helm.sha256sum )
          tar -xzf "/tmp/${helm_archive}" -C /tmp linux-amd64/helm
          install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm

          hf_archive="helmfile_${HELMFILE_VERSION}_linux_amd64.tar.gz"
          hf_base="https://github.com/helmfile/helmfile/releases/download/v${HELMFILE_VERSION}"
          curl -fsSL --retry 3 -o "/tmp/${hf_archive}" "${hf_base}/${hf_archive}"
          curl -fsSL --retry 3 -o /tmp/helmfile-checksums.txt \
            "${hf_base}/helmfile_${HELMFILE_VERSION}_checksums.txt"
          ( cd /tmp && grep " ${hf_archive}\$" helmfile-checksums.txt | sha256sum -c - )
          tar -xzf "/tmp/${hf_archive}" -C /tmp helmfile
          install -m 0755 /tmp/helmfile /usr/local/bin/helmfile

          helm version --short
          helmfile --version

      - name: Set up Node
        # Renovate's package declares `engines: node ^24.11.0 || ^26.13.0`.
        # The runner's default Node 22 is missing RegExp.escape, which Renovate
        # calls while loading managers, so it dies before doing any work.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: myles-coleman
          repositories: homelab-cluster

      - name: Renovate
        env:
          RENOVATE_TOKEN: ${{ steps.app-token.outputs.token }}
          # No RENOVATE_USERNAME or RENOVATE_GIT_AUTHOR on purpose.
          #
          # With a GitHub App token Renovate uses platformCommit, where GitHub
          # itself sets the commit author. Setting gitAuthor made Renovate
          # disagree with the author GitHub actually wrote: the App ID is 5871444
          # but the bot user ID that appears in the commit is 359768212. Renovate
          # then stopped recognising its own commits, refused to rebase its own
          # PRs ("does not recognize the last commit author"), and postUpgradeTasks
          # never re-ran.
          #
          # Renovate's own docs: with a GitHub App and platformCommit you should
          # not configure gitAuthor. Leave both unset and it discovers the
          # identity from the token.
          RENOVATE_REPOSITORIES: '["myles-coleman/homelab-cluster"]'
          # postUpgradeTasks executes commands inside the repository, so the
          # only command permitted is the renderer itself.
          RENOVATE_ALLOWED_POST_UPGRADE_COMMANDS: '["^\\./scripts/render-helm-charts\\.sh$","^\\./scripts/render-dist\\.sh$"]'
          LOG_LEVEL: info
        run: npx --yes "renovate@${RENOVATE_VERSION}"
