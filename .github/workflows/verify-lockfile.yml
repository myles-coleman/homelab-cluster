name: verify-lockfile

# Fails when .github/workflows/actions.lock is stale. The lockfile is what pins
# every action in this directory, and the actions those actions use, to a
# commit; a workflow whose `uses:` changed without re-running `gh actions-lock`
# would otherwise run an unpinned dependency.
#
# Read-only and secret-free: `--verify` re-resolves each reference against
# upstream and writes nothing. It is not a required check on its own, but
# `dist-verify`'s `test` job keeps its name and its own gate untouched.
#
# Adapted from github/gh-actions-lock's .github/workflows/verify-lockfile.yml.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: verify-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify actions.lock
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Pinned to an exact release: the verifier decides whether the lockfile is
      # current, so it must not itself move. Renovate bumps this tag and the
      # lockfile entry in the same pull request.
      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.5.1

      - name: Verify the lockfile is current
        run: gh actions-lock --verify
