name: Generate Bootstrap Applications

on:
  push:
    branches:
      - main
    paths:
      - 'manifests/cluster/**'
      - 'manifests/cluster/kustomization.yaml'

jobs:
  generate-apps:
    runs-on: ubuntu-latest
    # The deploy key is an environment secret in a main-only environment, so a
    # pull_request workflow cannot read it. No required reviewer, so the
    # automatic bootstrap commit stays automatic.
    environment: bootstrap
    # The deploy key performs the push; the workflow token needs only read.
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          persist-credentials: false

      - name: Set up Git
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Install the deploy key for the push
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          git config --global core.sshCommand "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

      - name: Use the deploy key for the push
        run: git remote set-url origin "git@github.com:${{ github.repository }}.git"

      - name: Check for changes in manifests/cluster
        id: check_changes
        run: |
          if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -q "^manifests/cluster/"; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run generate-apps.sh script
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          chmod +x ./generate-apps.sh
          ./generate-apps.sh

      - name: Check for changes to commit
        id: git_status
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get application name
        if: steps.git_status.outputs.changes == 'true'
        id: app_name
        run: |
          APP_NAME=$(git status --porcelain manifests/bootstrap/ | grep -o '[^/]*-app.yaml' | sed 's/-app.yaml//' | tr '\n' ' ' | xargs)
          echo "name=$APP_NAME" >> "$GITHUB_OUTPUT"

      - name: Commit and push changes
        if: steps.git_status.outputs.changes == 'true'
        run: |
          git add manifests/bootstrap/
          git commit -m "chore: generate application: ${{ steps.app_name.outputs.name }}"
          git push origin HEAD:main
