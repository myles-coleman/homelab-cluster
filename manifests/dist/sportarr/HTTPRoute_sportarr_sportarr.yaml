apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    gethomepage.dev/description: Sports Event Collection Manager
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Downloaders
    gethomepage.dev/icon: sportarr.svg
    gethomepage.dev/name: Sportarr
    gethomepage.dev/pod-selector: app=sportarr
    gethomepage.dev/weight: "60"
  name: sportarr
  namespace: sportarr
spec:
  hostnames:
  - sportarr.cowlab.org
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: traefik-gateway
    namespace: traefik
    sectionName: websecure
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: sportarr
      port: 1867
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
