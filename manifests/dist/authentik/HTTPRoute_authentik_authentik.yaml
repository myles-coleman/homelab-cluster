apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    gethomepage.dev/description: Identity provider and forward-auth
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: System
    gethomepage.dev/icon: authentik.svg
    gethomepage.dev/name: Authentik
    gethomepage.dev/weight: "50"
  name: authentik
  namespace: authentik
spec:
  hostnames:
  - auth.cowlab.org
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: traefik-gateway
    namespace: traefik
    sectionName: websecure
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: authentik-server
      port: 80
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
