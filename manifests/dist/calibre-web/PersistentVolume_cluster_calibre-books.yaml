apiVersion: v1
kind: PersistentVolume
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  name: calibre-books
spec:
  accessModes:
  - ReadWriteMany
  capacity:
    storage: 1Gi
  nfs:
    path: /mnt/md0/data/media/books
    server: 10.0.0.150
  persistentVolumeReclaimPolicy: Retain
