apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    gethomepage.dev/description: Browse and Read eBooks
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Media
    gethomepage.dev/icon: calibre.svg
    gethomepage.dev/name: Calibre-Web
    gethomepage.dev/pod-selector: app=calibre
    gethomepage.dev/weight: "20"
  name: calibre
  namespace: calibre
spec:
  hostnames:
  - calibre.cowlab.org
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: traefik-gateway
    namespace: traefik
    sectionName: websecure
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: calibre
      port: 8083
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
