apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-secret
  namespace: argocd
spec:
  data:
  - remoteRef:
      key: ccbcba88-dcfb-4ec4-8223-453dd5491d67
    secretKey: ARGOCD_CLIENT_SECRET
  - remoteRef:
      key: 3e15f1f7-3960-4fe9-b9e4-9031f3823e86
    secretKey: ARGOCD_SERVER_SECRETKEY
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-notes
  target:
    creationPolicy: Merge
    name: argocd-secret
    template:
      data:
        oidc.sso.clientSecret: '{{ .ARGOCD_CLIENT_SECRET | replace "\n" "" | replace
          "\r" "" }}'
        server.secretkey: '{{ .ARGOCD_SERVER_SECRETKEY | replace "\n" "" | replace
          "\r" "" }}'
      engineVersion: v2
      metadata:
        annotations:
          helm.sh/resource-policy: keep
