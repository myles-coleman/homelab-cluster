apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    gethomepage.dev/description: Private metasearch engine
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Services
    gethomepage.dev/icon: searxng.svg
    gethomepage.dev/name: SearXNG
    gethomepage.dev/pod-selector: app=searxng
    gethomepage.dev/weight: "60"
  name: searxng
  namespace: searxng
spec:
  hostnames:
  - searxng.cowlab.org
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: traefik-gateway
    namespace: traefik
    sectionName: websecure
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: searxng
      port: 80
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
