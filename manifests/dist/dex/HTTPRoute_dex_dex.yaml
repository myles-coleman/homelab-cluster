apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    gethomepage.dev/description: OIDC connector for Argo CD
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: System
    gethomepage.dev/icon: mdi-shield-key
    gethomepage.dev/name: Dex
    gethomepage.dev/weight: "60"
  name: dex
  namespace: dex
spec:
  hostnames:
  - dex.cowlab.org
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: traefik-gateway
    namespace: traefik
    sectionName: websecure
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: dex
      port: 5556
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /dex
