apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: github-client-secret
  namespace: dex
spec:
  data:
  - remoteRef:
      key: 9189b1cf-8124-49c3-83f3-673079fa34b1
    secretKey: GITHUB_CLIENT_SECRET
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-notes
  target:
    creationPolicy: Owner
    name: github-client-secret
    template:
      data:
        GITHUB_CLIENT_SECRET: '{{ .GITHUB_CLIENT_SECRET | replace "\n" "" | replace
          "\r" "" }}'
      engineVersion: v2
