apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: github-client-id
  namespace: dex
spec:
  data:
  - remoteRef:
      key: d9db5bed-fd82-4861-aa49-274d94ce9cb0
    secretKey: GITHUB_CLIENT_ID
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-notes
  target:
    creationPolicy: Owner
    name: github-client-id
    template:
      data:
        GITHUB_CLIENT_ID: '{{ .GITHUB_CLIENT_ID | replace "\n" "" | replace "\r" ""
          }}'
      engineVersion: v2
