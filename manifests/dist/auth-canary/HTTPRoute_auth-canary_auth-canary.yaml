apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: auth-canary
  namespace: auth-canary
spec:
  hostnames:
  - auth-canary.cowlab.org
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: traefik-gateway
    namespace: traefik
    sectionName: websecure
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: auth-canary
      port: 80
      weight: 1
    filters:
    - extensionRef:
        group: traefik.io
        kind: Middleware
        name: authentik-error-page
      type: ExtensionRef
    - extensionRef:
        group: traefik.io
        kind: Middleware
        name: authentik
      type: ExtensionRef
    matches:
    - path:
        type: PathPrefix
        value: /
