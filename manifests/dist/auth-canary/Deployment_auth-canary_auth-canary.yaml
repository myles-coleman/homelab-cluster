apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-canary
  namespace: auth-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-canary
  template:
    metadata:
      labels:
        app: auth-canary
    spec:
      automountServiceAccountToken: false
      containers:
      - image: nginxinc/nginx-unprivileged:1.29-alpine@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
        imagePullPolicy: IfNotPresent
        name: nginx
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 16Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /etc/nginx/conf.d/default.conf
          name: config
          readOnly: true
          subPath: default.conf
        - mountPath: /tmp
          name: tmp
        - mountPath: /var/cache/nginx
          name: cache
        - mountPath: /var/run
          name: run
        - mountPath: /var/log/nginx
          name: logs
      securityContext:
        fsGroup: 101
        runAsGroup: 101
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - configMap:
          items:
          - key: default.conf
            path: default.conf
          name: auth-canary
        name: config
      - emptyDir: {}
        name: tmp
      - emptyDir: {}
        name: cache
      - emptyDir: {}
        name: run
      - emptyDir: {}
        name: logs
