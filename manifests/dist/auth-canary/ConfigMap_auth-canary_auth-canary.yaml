apiVersion: v1
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;

      location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
      }

      location = /forbidden {
        default_type text/plain;
        return 403 'forbidden by canary\n';
      }

      location / {
        default_type text/plain;
        return 200 'auth canary ok\n';
      }
    }
kind: ConfigMap
metadata:
  name: auth-canary
  namespace: auth-canary
