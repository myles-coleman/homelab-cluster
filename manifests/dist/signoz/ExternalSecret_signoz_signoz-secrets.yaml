      conversionStrategy: Default
      decodingStrategy: None
      key: 7788797c-00c2-4e4e-91e9-0ada97ba19b2
      metadataPolicy: None
    secretKey: jwt-secret
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
