apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ytdl
  namespace: youtubedl-material
spec:
  hostnames:
  - ytdl.cowlab.org
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: traefik-gateway
    namespace: traefik
    sectionName: websecure
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: youtubedl-material
      port: 17442
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
