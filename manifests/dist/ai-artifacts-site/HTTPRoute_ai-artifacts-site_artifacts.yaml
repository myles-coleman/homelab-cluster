apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    gethomepage.dev/description: Published research and design notes
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Services
    gethomepage.dev/icon: obsidian.svg
    gethomepage.dev/name: AI Artifacts
    gethomepage.dev/pod-selector: app=ai-artifacts-site
    gethomepage.dev/weight: "70"
  name: artifacts
  namespace: ai-artifacts-site
spec:
  hostnames:
  - artifacts.cowlab.org
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: traefik-gateway
    namespace: traefik
    sectionName: websecure
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: ai-artifacts-site
      port: 80
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
