apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: squid-ingress
  namespace: squid
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: agent-sandbox
    ports:
    - port: 3128
      protocol: TCP
  podSelector:
    matchLabels:
      app: squid
  policyTypes:
  - Ingress
