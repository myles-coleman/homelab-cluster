apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    gethomepage.dev/description: Search and Download eBooks
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Downloaders
    gethomepage.dev/icon: readarr.svg
    gethomepage.dev/name: Openbooks
    gethomepage.dev/pod-selector: app=openbooks
    gethomepage.dev/weight: "70"
  name: openbooks
  namespace: openbooks
spec:
  hostnames:
  - openbooks.cowlab.org
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: traefik-gateway
    namespace: traefik
    sectionName: websecure
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: openbooks
      port: 80
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
