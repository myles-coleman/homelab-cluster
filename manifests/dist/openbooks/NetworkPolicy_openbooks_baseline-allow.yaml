apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: baseline-allow
  namespace: openbooks
spec:
  egress:
  - {}
  ingress:
  - from:
    - podSelector: {}
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: signoz
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: signoz-k8s-infra
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
