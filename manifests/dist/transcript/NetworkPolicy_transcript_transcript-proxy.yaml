apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: transcript-proxy
  namespace: transcript
spec:
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  - ports:
    - port: 8090
      protocol: TCP
    to:
    - ipBlock:
        cidr: 100.127.170.8/32
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
    ports:
    - port: 8080
      protocol: TCP
  podSelector:
    matchLabels:
      app: transcript-proxy
  policyTypes:
  - Ingress
  - Egress
