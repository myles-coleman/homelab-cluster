apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: collector
    app.kubernetes.io/name: sandbox-telemetry
  name: sandbox-telemetry
  namespace: sandbox-telemetry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox-telemetry
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: collector
        app.kubernetes.io/name: sandbox-telemetry
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - --config=/conf/config.yaml
        image: docker.io/otel/opentelemetry-collector-contrib@sha256:faf125d656fa47cea568b2f3b4494efd2525083bc75c1e96038bc23f05cd68fd
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: health
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
        name: collector
        ports:
        - containerPort: 13134
          name: health
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            memory: 192Mi
          requests:
            cpu: 20m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /conf
          name: config
          readOnly: true
        - mountPath: /etc/strata
          name: strata-token
          readOnly: true
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      nodeSelector:
        kubernetes.io/hostname: sandbox-node
      securityContext:
        fsGroup: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      tolerations:
      - effect: NoSchedule
        key: sandbox
        operator: Equal
        value: gvisor
      - effect: NoExecute
        key: node.kubernetes.io/not-ready
        operator: Exists
        tolerationSeconds: 300
      - effect: NoExecute
        key: node.kubernetes.io/unreachable
        operator: Exists
        tolerationSeconds: 300
      - effect: NoSchedule
        key: node.kubernetes.io/disk-pressure
        operator: Exists
      - effect: NoSchedule
        key: node.kubernetes.io/memory-pressure
        operator: Exists
      - effect: NoSchedule
        key: node.kubernetes.io/pid-pressure
        operator: Exists
      - effect: NoSchedule
        key: node.kubernetes.io/unschedulable
        operator: Exists
      volumes:
      - configMap:
          name: sandbox-telemetry-collector
        name: config
      - name: strata-token
        secret:
          defaultMode: 288
          items:
          - key: api_key
            path: api_key
          secretName: sandbox-telemetry-strata
