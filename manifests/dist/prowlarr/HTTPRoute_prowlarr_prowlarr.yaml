apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    gethomepage.dev/description: Indexer Collection Manager
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Downloaders
    gethomepage.dev/icon: prowlarr.svg
    gethomepage.dev/name: Prowlarr
    gethomepage.dev/pod-selector: app=prowlarr
    gethomepage.dev/weight: "50"
    gethomepage.dev/widget.key: '{{HOMEPAGE_VAR_PROWLARR_KEY}}'
    gethomepage.dev/widget.type: prowlarr
    gethomepage.dev/widget.url: http://prowlarr.prowlarr.svc.cluster.local:9696
  name: prowlarr
  namespace: prowlarr
spec:
  hostnames:
  - prowlarr.cowlab.org
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: traefik-gateway
    namespace: traefik
    sectionName: websecure
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: prowlarr
      port: 9696
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
