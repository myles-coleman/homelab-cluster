apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: copyparty
  namespace: copyparty
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
    ports:
    - port: 3923
      protocol: TCP
  podSelector:
    matchLabels:
      app: copyparty
  policyTypes:
  - Ingress
