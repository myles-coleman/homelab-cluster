apiVersion: v1
data:
  copyparty.conf: |
    # Copyparty configuration.
    #
    # There is no [accounts] block on purpose: identity comes from the Authentik
    # forward-auth headers, so the file holds no credential and a config parse
    # error (which dumps this file into the log) cannot leak one.
    [global]
      p: 3923
      e2dsa
      e2ts
      hist: /cfg/hists/
      idp-h-usr: X-Authentik-Username
      idp-h-grp: X-Authentik-Groups
      idp-h-key: X-Idp-Key
      # Authentik joins the user's groups into one header value with a pipe
      # ("homelab|copyparty-admins"); copyparty splits that value on every
      # character listed here. With "," alone the entire value parses as a
      # single group name, matches no @group below, and every authenticated
      # user gets "welcome back" instead of the file browser.
      idp-gsep: |,
      xff-hdr: cf-connecting-ip
      xff-src: 10.42.0.0/16
      u2sz: 1,64,96
      # One extra <link rel="stylesheet"> on the file browser, served from the
      # read-only [/theme] volume below. This is copyparty's own --css-browser
      # hook; remove this line to get the unmodified UI back.
      css-browser: /theme/theme.css

    [/]
      /w
      accs:
        r: @homelab
        rw: @homelab

    # Library access is limited to the Authentik group that names the people who
    # may manage media, not to a local account.
    [/media]
      /w/media
      accs:
        r: @copyparty-admins
        rw: @copyparty-admins

    # Static assets the browser loads for the UI. Read-only, and readable by the
    # same group as everything else: the stylesheet request arrives through the
    # same Authentik gate as the page that references it.
    [/theme]
      /cfg/ui
      accs:
        r: @homelab

    [/uploads]
      /w/uploads
      accs:
        w: @homelab
        rw: @homelab
      flags:
        e2d
        nodupe
kind: ConfigMap
metadata:
  name: copyparty-config
  namespace: copyparty
