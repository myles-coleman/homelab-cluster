apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: copyparty-config
  namespace: copyparty
spec:
  data:
  - remoteRef:
      key: c5412c5a-9ab7-4b29-9fd5-a73c79ff0fc2
    secretKey: COPYPARTY_ADMIN_HASH
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-notes
  target:
    creationPolicy: Owner
    name: copyparty-config
    template:
      data:
        copyparty.conf: |
          [global]
            p: 3923
            e2dsa
            e2ts
            hist: /cfg/hists/
            ah-alg: sha2
            ah-salt: YLPOhD41E13d/ahvsKphBZFD
            idp-h-usr: X-Authentik-Username
            idp-h-grp: X-Authentik-Groups
            idp-h-key: X-Idp-Key
            idp-gsep: ,
            xff-hdr: cf-connecting-ip
            xff-src: 10.42.0.0/16
            u2sz: 1,64,96

          [accounts]
            admin: {{ .COPYPARTY_ADMIN_HASH }}

          [/]
            /w
            accs:
              r: @homelab
              rw: @homelab

          [/media]
            /w/media
            accs:
              r: admin
              rw: admin

          [/uploads]
            /w/uploads
            accs:
              w: @homelab
              rw: @homelab
            flags:
              e2d
              nodupe
      engineVersion: v2
