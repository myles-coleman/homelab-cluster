apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: copyparty-config
  namespace: copyparty
spec:
  data:
  - remoteRef:
      key: 3bdd99ed-868b-467d-8287-a2a176c7b231
    secretKey: COPYPARTY_ADMIN_PASSWORD
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-notes
  target:
    creationPolicy: Owner
    name: copyparty-config
    template:
      data:
        copyparty.conf: |
          [global]
            p: 3923
            e2dsa
            e2ts
            hist: /cfg/hists/
            idp-h-usr: X-Authentik-Username
            idp-h-grp: X-Authentik-Groups
            idp-h-key: X-Idp-Key
            idp-gsep: ,
            xff-hdr: cf-connecting-ip
            xff-src: 10.42.0.0/16
            u2sz: 1,64,96

          [accounts]
            admin: {{ .COPYPARTY_ADMIN_PASSWORD }}

          [/]
            /w
            accs:
              r: @homelab
              rw: @homelab
            flags:
              maxb=4g

          [/media]
            /w/media
            accs:
              r: admin
              rw: admin
            flags:
              maxb=4g

          [/uploads]
            /w/uploads
            accs:
              w: @homelab
              rw: @homelab
            flags:
              e2d
              nodupe
              maxb=4g
      engineVersion: v2
