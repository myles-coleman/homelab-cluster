apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    gethomepage.dev/description: File Sharing and Management
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Services
    gethomepage.dev/icon: copyparty.svg
    gethomepage.dev/name: Copyparty
    gethomepage.dev/pod-selector: app=copyparty
    gethomepage.dev/weight: "20"
  name: copyparty
  namespace: copyparty
spec:
  hostnames:
  - copyparty.cowlab.org
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: traefik-gateway
    namespace: traefik
    sectionName: websecure
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: copyparty
      port: 3923
      weight: 1
    filters:
    - extensionRef:
        group: traefik.io
        kind: Middleware
        name: authentik
      type: ExtensionRef
    - extensionRef:
        group: traefik.io
        kind: Middleware
        name: idp-key
      type: ExtensionRef
    matches:
    - path:
        type: PathPrefix
        value: /
