apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: copyparty
  name: copyparty
  namespace: copyparty
spec:
  replicas: 1
  selector:
    matchLabels:
      app: copyparty
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: copyparty
    spec:
      containers:
      - env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        image: copyparty/ac:1.18.6@sha256:6a925c50732959921262eb795eabfba2a6b3bf705c7a7115f01edf72a201d065
        livenessProbe:
          httpGet:
            path: /
            port: 3923
          initialDelaySeconds: 30
          periodSeconds: 10
        name: copyparty
        ports:
        - containerPort: 3923
        readinessProbe:
          httpGet:
            path: /
            port: 3923
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        volumeMounts:
        - mountPath: /cfg/copyparty.conf
          name: config-volume
          subPath: copyparty.conf
        - mountPath: /cfg/ui
          name: ui-volume
          readOnly: true
        - mountPath: /w
          name: data-volume
        - mountPath: /w/media
          name: media-volume
          subPath: data/media
        - mountPath: /cfg/hists
          name: persistent-config
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsUser: 1000
      volumes:
      - configMap:
          name: copyparty-config
        name: config-volume
      - configMap:
          name: copyparty-ui
        name: ui-volume
      - name: data-volume
        persistentVolumeClaim:
          claimName: copyparty-data
      - name: media-volume
        persistentVolumeClaim:
          claimName: copyparty-media
      - name: persistent-config
        persistentVolumeClaim:
          claimName: copyparty-hists
