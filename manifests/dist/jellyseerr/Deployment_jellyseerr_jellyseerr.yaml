apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyseerr
  namespace: jellyseerr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyseerr
  template:
    metadata:
      labels:
        app: jellyseerr
    spec:
      containers:
      - env:
        - name: LOG_LEVEL
          value: debug
        image: fallenbagel/jellyseerr:2.7.3-deprecated@sha256:91edd5620e51ed512ecdfd8b2e157c473faf385edf88c3764dc9ec32d310c0df
        name: jellyseerr
        resources:
          limits:
            cpu: 500m
            memory: 1024Mi
          requests:
            cpu: 250m
            memory: 512Mi
        volumeMounts:
        - mountPath: /app/config
          name: config-volume
      volumes:
      - name: config-volume
        persistentVolumeClaim:
          claimName: jellyseerr-config
