apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    gethomepage.dev/description: Media Library Manager
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Downloaders
    gethomepage.dev/icon: seerr.svg
    gethomepage.dev/name: Seerr
    gethomepage.dev/pod-selector: app=seerr
    gethomepage.dev/weight: "10"
  name: seerr
  namespace: jellyseerr
spec:
  hostnames:
  - seerr.cowlab.org
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: traefik-gateway
    namespace: traefik
    sectionName: websecure
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: seerr
      port: 5055
      weight: 1
    filters:
    - extensionRef:
        group: traefik.io
        kind: Middleware
        name: authentik
      type: ExtensionRef
    matches:
    - path:
        type: PathPrefix
        value: /
