apiVersion: apps/v1
kind: Deployment
metadata:
  name: seerr
  namespace: jellyseerr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seerr
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: seerr
    spec:
      containers:
      - env:
        - name: LOG_LEVEL
          value: debug
        - name: TZ
          value: Etc/UTC
        image: ghcr.io/seerr-team/seerr:v3.5.2@sha256:aadee014b40e28cf9aa4928bc9d1183a6eb08f8c44d543cddc9efdcb16549be2
        name: seerr
        ports:
        - containerPort: 5055
          name: http
        readinessProbe:
          failureThreshold: 6
          httpGet:
            path: /api/v1/settings/public
            port: 5055
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 1024Mi
          requests:
            cpu: 250m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: false
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /app/config
          name: config-volume
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      volumes:
      - name: config-volume
        persistentVolumeClaim:
          claimName: jellyseerr-config
