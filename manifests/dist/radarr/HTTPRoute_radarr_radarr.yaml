apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    gethomepage.dev/description: Movie Collection Manager
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Downloaders
    gethomepage.dev/icon: radarr.svg
    gethomepage.dev/name: Radarr
    gethomepage.dev/pod-selector: app=radarr
    gethomepage.dev/weight: "30"
  name: radarr
  namespace: radarr
spec:
  hostnames:
  - radarr.cowlab.org
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: traefik-gateway
    namespace: traefik
    sectionName: websecure
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: radarr
      port: 7878
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
