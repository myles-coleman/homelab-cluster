apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: validator-ingress
  namespace: agent-validator
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: agent-sandbox
      podSelector:
        matchLabels:
          app: opencode-sandbox
    ports:
    - port: 8443
      protocol: TCP
  podSelector:
    matchLabels:
      app: agent-validator
  policyTypes:
  - Ingress
