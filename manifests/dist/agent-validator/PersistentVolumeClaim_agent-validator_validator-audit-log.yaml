apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    app: agent-validator
    app.kubernetes.io/part-of: agent-broker
  name: validator-audit-log
  namespace: agent-validator
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path-retain
