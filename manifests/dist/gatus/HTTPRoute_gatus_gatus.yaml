apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    gethomepage.dev/description: Uptime checks for services outside the cluster
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: System
    gethomepage.dev/icon: gatus.svg
    gethomepage.dev/name: Gatus
    gethomepage.dev/pod-selector: app=gatus
    gethomepage.dev/weight: "85"
    gethomepage.dev/widget.type: gatus
    gethomepage.dev/widget.url: http://gatus.gatus.svc.cluster.local:8080
  name: gatus
  namespace: gatus
spec:
  hostnames:
  - status.cowlab.org
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: traefik-gateway
    namespace: traefik
    sectionName: websecure
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: gatus
      port: 8080
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
