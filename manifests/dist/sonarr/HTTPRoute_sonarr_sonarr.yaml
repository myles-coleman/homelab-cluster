apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    gethomepage.dev/description: TV Show Collection Manager
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Downloaders
    gethomepage.dev/icon: sonarr.svg
    gethomepage.dev/name: Sonarr
    gethomepage.dev/pod-selector: app=sonarr
    gethomepage.dev/weight: "20"
    gethomepage.dev/widget.enableQueue: "true"
    gethomepage.dev/widget.key: '{{HOMEPAGE_VAR_SONARR_KEY}}'
    gethomepage.dev/widget.type: sonarr
    gethomepage.dev/widget.url: http://sonarr.sonarr.svc.cluster.local:8989
  name: sonarr
  namespace: sonarr
spec:
  hostnames:
  - sonarr.cowlab.org
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: traefik-gateway
    namespace: traefik
    sectionName: websecure
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: sonarr
      port: 8989
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
