apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: opencode-sandbox-secrets
  namespace: agent-sandbox
spec:
  data:
  - remoteRef:
      key: d7fae6eb-9ce4-46f5-a0bf-3585692fe49d
    secretKey: strata-api-key
  - remoteRef:
      key: eb0b4bb6-c5d0-4815-ab0b-d2afe6df6444
    secretKey: opencode-server-password
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-notes
  target:
    creationPolicy: Owner
    name: opencode-sandbox-secrets
