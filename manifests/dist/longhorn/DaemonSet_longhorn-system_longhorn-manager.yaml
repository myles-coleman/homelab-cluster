apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app: longhorn-manager
    app.kubernetes.io/instance: longhorn
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: longhorn
    app.kubernetes.io/version: v1.11.2
    helm.sh/chart: longhorn-1.11.2
  name: longhorn-manager
  namespace: longhorn-system
spec:
  selector:
    matchLabels:
      app: longhorn-manager
  template:
    metadata:
      labels:
        app: longhorn-manager
        app.kubernetes.io/instance: longhorn
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: longhorn
        app.kubernetes.io/version: v1.11.2
        helm.sh/chart: longhorn-1.11.2
    spec:
      containers:
      - command:
        - longhorn-manager
        - -d
        - daemon
        - --engine-image
        - docker.io/longhornio/longhorn-engine:v1.11.2@sha256:7482e0437fbf475e1e32696fab22f47bf99b1ef8d067ffce9e34028347722628
        - --instance-manager-image
        - docker.io/longhornio/longhorn-instance-manager:v1.11.2@sha256:16dac125ef30bd3a375bc8ff7d10636ea0302d22d208c0cfb1be37ebb93ca30b
        - --share-manager-image
        - docker.io/longhornio/longhorn-share-manager:v1.11.2@sha256:c11559e998ea982e6bac1637d66cc2aaab662a6b546709f2e54e2bfa50ffb0c3
        - --backing-image-manager-image
        - docker.io/longhornio/backing-image-manager:v1.11.2
        - --support-bundle-manager-image
        - docker.io/longhornio/support-bundle-kit:v0.0.84
        - --manager-image
        - docker.io/longhornio/longhorn-manager:v1.11.2@sha256:0f80ca11ac4eb7522f4e6e801a7afc9909ea8d3041575f3d029964c46590f096
        - --service-account
        - longhorn-service-account
        - --upgrade-version-check
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        image: docker.io/longhornio/longhorn-manager:v1.11.2@sha256:0f80ca11ac4eb7522f4e6e801a7afc9909ea8d3041575f3d029964c46590f096
        imagePullPolicy: IfNotPresent
        name: longhorn-manager
        ports:
        - containerPort: 9500
          name: manager
        - containerPort: 9502
          name: admission-wh
        - containerPort: 9503
          name: recov-backend
        readinessProbe:
          httpGet:
            path: /v1/healthz
            port: 9502
            scheme: HTTPS
        securityContext:
          privileged: true
        volumeMounts:
        - mountPath: /host/boot/
          name: boot
          readOnly: true
        - mountPath: /host/dev/
          name: dev
        - mountPath: /host/proc/
          name: proc
          readOnly: true
        - mountPath: /host/etc/
          name: etc
          readOnly: true
        - mountPath: /var/lib/longhorn/
          mountPropagation: Bidirectional
          name: longhorn
        - mountPath: /tls-files/
          name: longhorn-grpc-tls
      - command:
        - sh
        - -c
        - echo share-manager image pulled && sleep infinity
        image: docker.io/longhornio/longhorn-share-manager:v1.11.2@sha256:c11559e998ea982e6bac1637d66cc2aaab662a6b546709f2e54e2bfa50ffb0c3
        imagePullPolicy: IfNotPresent
        name: pre-pull-share-manager-image
      priorityClassName: longhorn-critical
      serviceAccountName: longhorn-service-account
      volumes:
      - hostPath:
          path: /boot/
        name: boot
      - hostPath:
          path: /dev/
        name: dev
      - hostPath:
          path: /proc/
        name: proc
      - hostPath:
          path: /etc/
        name: etc
      - hostPath:
          path: /var/lib/longhorn/
        name: longhorn
      - name: longhorn-grpc-tls
        secret:
          optional: true
          secretName: longhorn-grpc-tls
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 100%
