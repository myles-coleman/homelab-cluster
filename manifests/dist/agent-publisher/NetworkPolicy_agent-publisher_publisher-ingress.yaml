apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: publisher-ingress
  namespace: agent-publisher
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: agent-validator
      podSelector:
        matchLabels:
          app: agent-validator
    ports:
    - port: 8443
      protocol: TCP
  podSelector:
    matchLabels:
      app: agent-publisher
  policyTypes:
  - Ingress
