apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: publisher-egress
  namespace: agent-publisher
spec:
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
  - ports:
    - port: 443
      protocol: TCP
    to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 10.42.0.0/16
        - 10.43.0.0/16
        - 10.0.0.0/8
        - 100.64.0.0/10
  podSelector:
    matchLabels:
      app: agent-publisher
  policyTypes:
  - Egress
