apiVersion: v1
data:
  bookmarks.yaml: |
    - Repository:
        - Github:
            - href: https://github.com/myles-coleman/homelab-cluster
  custom.css: ""
  custom.js: ""
  docker.yaml: ""
  kubernetes.yaml: |
    mode: cluster
    # Discovery is limited to the one provider this cluster uses. Traefik's
    # IngressRoute is retired here and networking.k8s.io/Ingress is forbidden
    # (AGENTS.md), so those scanners would only cost an API-server list on every
    # render — cluster-role.yaml no longer grants the verbs they need.
    ingress: false
    traefik: false
    gateway: true
  services.yaml: |
    # Only services that are NOT in this cluster belong here. Everything this
    # repository deploys is discovered from its HTTPRoute's gethomepage.dev/*
    # annotations, so adding a service no longer means editing this file, and
    # deleting one no longer leaves a dead card behind.
    #
    # These groups merge by name with the discovered ones. `weight` is required
    # where position matters: discovered services default to weight 0 and would
    # otherwise always sort above anything listed here.
    #
    # `siteMonitor: true` on each entry is what gives these cards an up/down dot:
    # discovered services inherit Kubernetes pod state, but nothing in this cluster
    # runs these four, so Homepage has to probe them. It issues an unauthenticated
    # HEAD and then GET, which is why it works here — these hosts sit behind Traefik
    # only, and would need an internal URL if they were ever put behind forward-auth.
    # Uptime Kuma keeps the history and alerting; this is just the at-a-glance dot.
    - Media:
        - Jellyfin:
            icon: jellyfin.svg
            href: https://jellyfin.cowlab.org/
            description: Media Server
            weight: 10
            siteMonitor: https://jellyfin.cowlab.org/

    - Services:
        - Vaultwarden:
            icon: vaultwarden.svg
            href: https://vaultwarden.cowlab.org/
            description: Password Manager
            weight: 5
        # Tailnet-only by design: no cluster route, no tunnel record. The card is a
        # plain link, so it works from a browser on the tailnet; Homepage itself
        # cannot reach it and deliberately has no widget for it.
        - Transcript:
            icon: youtube.svg
            href: https://bee-gpu-server.tail6d2e9b.ts.net/
            description: YouTube to English transcript (GPU)
            weight: 15
            siteMonitor: https://vaultwarden.cowlab.org/

    - System:
        - Pikvm:
            icon: pikvm.svg
            href: https://pikvm.cowlab.org/
            description: KVM Over IP
            weight: 10
            siteMonitor: https://pikvm.cowlab.org/
        - Nginx Proxy Manager:
            icon: nginx-proxy-manager.svg
            href: https://npm.cowlab.org/
            description: Proxy Server
            weight: 40
            siteMonitor: https://npm.cowlab.org/
        - Pi-hole:
            icon: pi-hole.svg
            # Not the bare host: Pi-hole answers 403 at `/` and serves the UI under
            # /admin/, so linking the root would land the card on a Forbidden page.
            href: https://pihole.cowlab.org/admin/
            description: DNS and ad blocking
            weight: 45
            # `/admin/` redirects to the login form, which is a 200 — measured from
            # this pod, since a monitor pointed at a 403 would report a healthy
            # Pi-hole as down.
            siteMonitor: https://pihole.cowlab.org/admin/login
  settings.yaml: |
    title: Cowlab

    # `layout` keys are group names, and their order is the group order on the
    # page. Every group a service is filed under must appear here — including the
    # groups that exist only as HTTPRoute annotations. A group that is missing
    # still renders, but untabbed and after these ones.
    layout:
      Downloaders:
        style: row
        columns: 4
        tab: Media
      Media:
        style: row
        columns: 2
        tab: Media
      Services:
        style: row
        columns: 4
        tab: Apps
      System:
        style: row
        columns: 4
        tab: Infra

    # No `theme:` on purpose: setting it locks the light/dark switcher.
    headerStyle: clean
    color: slate
    # Dots rather than the default badge, because discovered services inherit
    # Kubernetes pod state and a wall of green badges drowns that signal out.
    statusStyle: dot
    quicklaunch:
      searchDescriptions: true

    # Longhorn is an *info* widget, not a service widget, so its credentials live here
    # rather than on an HTTPRoute annotation. In-cluster and unauthenticated: this
    # Longhorn install exposes its frontend API without auth, so the URL is the only
    # input and no Secret is involved. Verified reachable at this address from the
    # homepage pod before wiring it up.
    providers:
      longhorn:
        url: http://longhorn-frontend.longhorn-system.svc.cluster.local
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: false
          cpu: true
          memory: true
          showLabel: true
    # Storage health. `total` gives the aggregate bar; `nodes` stays false because
    # Longhorn already spreads replicas per node and five per-node bars say less than
    # the one number that matters, which is how much of the pool is in use.
    - longhorn:
        expanded: true
        total: true
        labels: true
        nodes: false
    - datetime:
        text_size: xl
        format:
          timeStyle: short
    - search:
        provider: brave
        target: _blank
kind: ConfigMap
metadata:
  name: homepage-925thf878m
  namespace: homepage
