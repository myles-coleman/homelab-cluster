apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-mcp
  namespace: argocd-mcp
spec:
  hostnames:
  - argocd-mcp.cowlab.org
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: traefik-gateway
    namespace: traefik
    sectionName: websecure
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: argocd-mcp
      port: 3000
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
