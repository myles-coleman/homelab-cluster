apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    gethomepage.dev/description: MCP server for Argo CD
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: System
    gethomepage.dev/icon: argo-cd.svg
    gethomepage.dev/name: Argo CD MCP
    gethomepage.dev/pod-selector: app=argocd-mcp
    gethomepage.dev/weight: "80"
  name: argocd-mcp
  namespace: argocd-mcp
spec:
  hostnames:
  - argocd-mcp.cowlab.org
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: traefik-gateway
    namespace: traefik
    sectionName: websecure
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: argocd-mcp
      port: 3000
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
