apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-mcp
  namespace: argocd-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argocd-mcp
  template:
    metadata:
      labels:
        app: argocd-mcp
    spec:
      containers:
      - args:
        - http
        - --allow-unauthenticated
        env:
        - name: TZ
          value: Etc/UTC
        - name: MCP_BIND_ADDRESS
          value: 0.0.0.0
        - name: ARGOCD_BASE_URL
          value: http://argocd-server.argocd.svc.cluster.local
        - name: ARGOCD_API_TOKEN
          valueFrom:
            secretKeyRef:
              key: api-token
              name: argocd-mcp-credentials
        - name: MCP_READ_ONLY
          value: "true"
        - name: NODE_TLS_REJECT_UNAUTHORIZED
          value: "0"
        image: ghcr.io/argoproj-labs/mcp-for-argocd:v0.9.0@sha256:dffc6c719d8635be2d5f2c8ad1c0178540325da4b40da0b373307e12b4c48f86
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 30
        name: argocd-mcp
        ports:
        - containerPort: 3000
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      volumes:
      - emptyDir: {}
        name: tmp
