apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    gethomepage.dev/description: AI Chat Interface
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Services
    gethomepage.dev/icon: open-webui.svg
    gethomepage.dev/name: Open WebUI
    gethomepage.dev/pod-selector: app=open-webui
    gethomepage.dev/weight: "30"
  name: openwebui
  namespace: open-webui
spec:
  hostnames:
  - chat.cowlab.org
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: traefik-gateway
    namespace: traefik
    sectionName: websecure
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: open-webui
      port: 8080
      weight: 1
    filters:
    - extensionRef:
        group: traefik.io
        kind: Middleware
        name: authentik
      type: ExtensionRef
    matches:
    - path:
        type: PathPrefix
        value: /
