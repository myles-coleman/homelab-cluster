apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: prowlarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prowlarr
  template:
    metadata:
      labels:
        app: prowlarr
    spec:
      initContainers:
      # Native sidecar. Same egress path as qBittorrent: pod -> tailnet ->
      # protecli-vault exit node -> Mullvad. Keeps indexer API traffic off the
      # home ISP while sharing the Vault's single Mullvad device.
      - name: tailscale
        image: tailscale/tailscale:stable
        restartPolicy: Always
        env:
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef:
              name: tailscale-auth
              key: authkey
        - name: TS_STATE_DIR
          value: /var/lib/tailscale
        - name: TS_USERSPACE
          value: "false"
        - name: TS_ACCEPT_DNS
          value: "true"
        - name: TS_HOSTNAME
          value: prowlarr-egress
        - name: TS_EXTRA_ARGS
          value: "--exit-node=protecli-vault --exit-node-allow-lan-access"
        securityContext:
          capabilities:
            add: ["NET_ADMIN"]
        resources:
          limits:
            memory: "256Mi"
            cpu: "200m"
          requests:
            memory: "64Mi"
            cpu: "50m"
        startupProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - tailscale status --json | grep -Eq '"BackendState":[[:space:]]*"Running"'
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - tailscale status --json | grep -Eq '"BackendState":[[:space:]]*"Running"'
          periodSeconds: 10
        volumeMounts:
        - name: tailscale-state
          mountPath: /var/lib/tailscale
        - name: dev-net-tun
          mountPath: /dev/net/tun
      containers:
      - name: prowlarr
        image: lscr.io/linuxserver/prowlarr:latest
        resources:
          limits:
            memory: "1024Mi"
            cpu: "500m"
          requests:
            memory: "512Mi"
            cpu: "250m"
        env:
        - name: TZ
          value: "Etc/UTC"
        ports:
        - containerPort: 9696
        volumeMounts:
        - name: data-volume
          mountPath: /data
        - name: config-volume
          mountPath: /config
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: prowlarr-data
      - name: config-volume
        persistentVolumeClaim:
          claimName: prowlarr-config
      - name: tailscale-state
        persistentVolumeClaim:
          claimName: prowlarr-tailscale-state
      - name: dev-net-tun
        hostPath:
          path: /dev/net/tun
          type: CharDevice
