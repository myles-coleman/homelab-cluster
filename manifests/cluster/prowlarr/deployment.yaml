apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: prowlarr
spec:
  replicas: 1
  # The Longhorn config volume is ReadWriteOnce. maxSurge 0 stops the new pod
  # from starting before the old one releases the volume; maxUnavailable 1 lets
  # the old pod terminate first. type Recreate is rejected by the API because
  # the live Deployment retains the default rollingUpdate fields.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: prowlarr
  template:
    metadata:
      labels:
        app: prowlarr
    spec:
      # Neither container talks to the Kubernetes API. Drop the token so a
      # compromised app cannot read the tailscale-auth Secret.
      automountServiceAccountToken: false
      initContainers:
      # Pod-level kill switch. Same policy as qBittorrent: only root
      # (tailscaled) may use the pod network directly, the app (uid 911) may
      # reach only tailscale0 or in-cluster CIDRs, everything else is dropped.
      # If the sidecar dies and the exit-node route disappears, Prowlarr cannot
      # fall back to the home ISP.
      - name: killswitch
        image: tailscale/tailscale:stable@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
        command:
        - /bin/sh
        - -c
        - |
          set -eu
          # The image's `iptables` symlink points at the legacy backend, which
          # the nodes' nftables-only kernel rejects. Use the nft backend.
          IPT=iptables-nft
          IP6T=ip6tables-nft
          command -v "$IPT" >/dev/null 2>&1 || IPT=iptables
          command -v "$IP6T" >/dev/null 2>&1 || IP6T=ip6tables
          "$IPT" -A OUTPUT -o lo -j ACCEPT
          "$IPT" -A OUTPUT -o tailscale0 -j ACCEPT
          "$IPT" -A OUTPUT -d 10.42.0.0/16 -j ACCEPT
          "$IPT" -A OUTPUT -d 10.43.0.0/16 -j ACCEPT
          "$IPT" -A OUTPUT -m owner --uid-owner 0 -j ACCEPT
          "$IPT" -A OUTPUT -j DROP
          if [ -d /proc/sys/net/ipv6 ]; then
            "$IP6T" -A OUTPUT -o lo -j ACCEPT
            "$IP6T" -A OUTPUT -o tailscale0 -j ACCEPT
            "$IP6T" -A OUTPUT -m owner --uid-owner 0 -j ACCEPT
            "$IP6T" -A OUTPUT -j DROP
          fi

          # Keep cluster traffic off the exit node.
          #
          # With `--exit-node` set, tailscaled installs `5270: from all lookup 52`
          # and puts `default dev tailscale0` in table 52. The only exemption it
          # adds is the pod's own /24 (`throw 10.42.1.0/24`), so a reply to a
          # client on any OTHER node is routed into the tunnel and never arrives.
          # That is the whole symptom: this app answers on its own subnet and
          # times out from Traefik, which runs on node2.
          #
          # These rules sit before tailscaled's 5270 and send cluster
          # destinations to the main table instead. Internet egress is untouched:
          # the OUTPUT chain above still DROPs everything that is not loopback,
          # tailscale0, or one of these two CIDRs, so the leak protection is
          # exactly as strict as before — only the path to in-cluster clients
          # changed.
          #
          # `|| true` because a rule that already exists makes `ip` exit non-zero,
          # and `set -eu` would turn that into a failed init container.
          ip rule add to 10.42.0.0/16 lookup main priority 5255 || true
          ip rule add to 10.43.0.0/16 lookup main priority 5256 || true
        securityContext:
          capabilities:
            add: ["NET_ADMIN"]
        resources:
          limits:
            memory: "64Mi"
            cpu: "100m"
          requests:
            memory: "16Mi"
            cpu: "25m"
      # Native sidecar. Same egress path as qBittorrent: pod -> tailnet ->
      # protecli-vault exit node -> Mullvad. Keeps indexer API traffic off the
      # home ISP while sharing the Vault's single Mullvad device.
      - name: tailscale
        image: tailscale/tailscale:stable@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
        restartPolicy: Always
        env:
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef:
              name: tailscale-auth
              key: authkey
        # Use the PVC for state. Without this, containerboot defaults to a
        # Kubernetes Secret and needs the service-account namespace file, which
        # automountServiceAccountToken=false removes.
        - name: TS_KUBE_SECRET
          value: ""
        - name: TS_STATE_DIR
          value: /var/lib/tailscale
        - name: TS_USERSPACE
          value: "false"
        - name: TS_ACCEPT_DNS
          value: "true"
        - name: TS_HOSTNAME
          value: prowlarr-egress
        - name: TS_EXTRA_ARGS
          value: "--exit-node=100.112.185.27 --exit-node-allow-lan-access"
        securityContext:
          capabilities:
            add: ["NET_ADMIN"]
        resources:
          limits:
            memory: "256Mi"
            cpu: "200m"
          requests:
            memory: "64Mi"
            cpu: "50m"
        startupProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - tailscale status --json | grep -Eq '"BackendState":[[:space:]]*"Running"'
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - tailscale status --json | grep -Eq '"BackendState":[[:space:]]*"Running"'
          periodSeconds: 10
        volumeMounts:
        - name: tailscale-state
          mountPath: /var/lib/tailscale
        - name: dev-net-tun
          mountPath: /dev/net/tun
      containers:
      - name: prowlarr
        image: lscr.io/linuxserver/prowlarr:version-3.0.2.5780@sha256:45117ba8439e2337a92ffe38a451a4dafc0be771754d05d88cdf102419d09646
        resources:
          limits:
            memory: "1024Mi"
            cpu: "500m"
          requests:
            memory: "512Mi"
            cpu: "250m"
        env:
        - name: TZ
          value: "Etc/UTC"
        ports:
        - containerPort: 9696
        volumeMounts:
        - name: data-volume
          mountPath: /data
        - name: config-volume
          mountPath: /config
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: prowlarr-data
      - name: config-volume
        persistentVolumeClaim:
          claimName: prowlarr-config
      - name: tailscale-state
        persistentVolumeClaim:
          claimName: prowlarr-tailscale-state
      - name: dev-net-tun
        hostPath:
          path: /dev/net/tun
          type: CharDevice
