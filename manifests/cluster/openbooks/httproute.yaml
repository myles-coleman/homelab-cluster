apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openbooks
  namespace: openbooks
  annotations:
    gethomepage.dev/description: Search and Download eBooks
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Downloaders
    gethomepage.dev/icon: readarr.svg
    gethomepage.dev/name: Openbooks
    gethomepage.dev/pod-selector: "app=openbooks"
    gethomepage.dev/weight: "70"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - openbooks.cowlab.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: openbooks
          port: 80
          weight: 1
