# Selectorless Service + EndpointSlice pointing at Strata's tailnet address
# (spec 20, Unit 3). Every node has a Tailscale route, so no proxy component is
# needed. EndpointSlice rather than the deprecated Endpoints API.
apiVersion: v1
kind: Service
metadata:
  name: strata
  namespace: strata
spec:
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
