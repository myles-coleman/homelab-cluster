apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: strata
  namespace: strata
  labels:
    kubernetes.io/service-name: strata
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 8080
endpoints:
  - addresses:
      # bee-gpu-server's tailnet address; 192.168.1.10:8080 times out because the
      # two LANs have no forwarding path.
      - 100.127.170.8
    conditions:
      ready: true
