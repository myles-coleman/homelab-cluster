apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: open-webui-secrets
  namespace: open-webui
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-notes
  target:
    name: open-webui-secrets
    creationPolicy: Owner
  data:
  - secretKey: secret-key
    remoteRef:
      key: b6c2ef23-0115-41da-b045-f59610782a5c
  # The Strata API key (spec 24), read from the SAME Vaultwarden note the agent
  # sandbox consumes: the note body must equal `strata_api_key` in
  # secrets/hosts/bee-gpu-server.yaml, so a rotation is one edit here and one
  # refresh interval for both consumers. As with the sandbox, the note body must
  # be EXACTLY the key - no label, no trailing newline - or the value carries
  # junk and every call 401s in a way that looks like a network fault.
  - secretKey: strata-api-key
    remoteRef:
      key: d7fae6eb-9ce4-46f5-a0bf-3585692fe49d
