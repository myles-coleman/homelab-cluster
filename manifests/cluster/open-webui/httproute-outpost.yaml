# The Authentik login callback for this host.
#
# Single-application forward auth redirects the browser to
# `/outpost.goauthentik.io/...` on the application's own hostname, and the
# outpost is reached through this route. It must NOT carry the forward-auth
# filter — it is the endpoint that performs the authentication.
#
# The cross-namespace backend is permitted by ReferenceGrant
# `allow-outpost-routes` in the `authentik` namespace, which already lists this
# namespace.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openwebui-outpost
  namespace: open-webui
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - chat.cowlab.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /outpost.goauthentik.io
      backendRefs:
        - group: ""
          kind: Service
          name: authentik-outpost
          namespace: authentik
          port: 9000
          weight: 1
