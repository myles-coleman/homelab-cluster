apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openwebui
  namespace: open-webui
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - chat.cowlab.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # The shared forward-auth gate. The namespace-local copy, because Traefik
      # resolves ExtensionRef in the route's namespace.
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: authentik
      backendRefs:
        - group: ""
          kind: Service
          name: open-webui
          port: 8080
          weight: 1
