# Pod Security Admission: baseline where the workloads satisfy it,
# privileged where a verified host-level requirement does not. The level is
# derived by scripts/audit-pss.py from live pods and rendered templates; run
# task pss after changing a workload.
#
# Measured exception: Longhorn manager, engine and CSI pods are privileged with host mounts; denying them risks volume data, not just uptime.
apiVersion: v1
kind: Namespace
metadata:
  name: longhorn-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: longhorn
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
