# Only services that are NOT in this cluster belong here. Everything this
# repository deploys is discovered from its HTTPRoute's gethomepage.dev/*
# annotations, so adding a service no longer means editing this file, and
# deleting one no longer leaves a dead card behind.
#
# These groups merge by name with the discovered ones. `weight` is required
# where position matters: discovered services default to weight 0 and would
# otherwise always sort above anything listed here.
#
# `siteMonitor: true` on each entry is what gives these cards an up/down dot:
# discovered services inherit Kubernetes pod state, but nothing in this cluster
# runs these four, so Homepage has to probe them. It issues an unauthenticated
# HEAD and then GET, which is why it works here — these hosts sit behind Traefik
# only, and would need an internal URL if they were ever put behind forward-auth.
# Uptime Kuma keeps the history and alerting; this is just the at-a-glance dot.
- Media:
    - Jellyfin:
        icon: jellyfin.svg
        href: https://jellyfin.cowlab.org/
        description: Media Server
        weight: 10
        siteMonitor: https://jellyfin.cowlab.org/

- Services:
    - Vaultwarden:
        icon: vaultwarden.svg
        href: https://vaultwarden.cowlab.org/
        description: Password Manager
        weight: 5
    # Tailnet-only by design: no cluster route, no tunnel record. The card is a
    # plain link, so it works from a browser on the tailnet; Homepage itself
    # cannot reach it and deliberately has no widget for it.
    - Transcript:
        icon: youtube.svg
        href: https://bee-gpu-server.tail6d2e9b.ts.net/
        description: YouTube to English transcript (GPU)
        weight: 15
        siteMonitor: https://vaultwarden.cowlab.org/

- System:
    - Pikvm:
        icon: pikvm.svg
        href: https://pikvm.cowlab.org/
        description: KVM Over IP
        weight: 10
        siteMonitor: https://pikvm.cowlab.org/
    - Nginx Proxy Manager:
        icon: nginx-proxy-manager.svg
        href: https://npm.cowlab.org/
        description: Proxy Server
        weight: 40
        siteMonitor: https://npm.cowlab.org/
    - Pi-hole:
        icon: pi-hole.svg
        # Not the bare host: Pi-hole answers 403 at `/` and serves the UI under
        # /admin/, so linking the root would land the card on a Forbidden page.
        href: https://pihole.cowlab.org/admin/
        description: DNS and ad blocking
        weight: 45
        # `/admin/` redirects to the login form, which is a 200 — measured from
        # this pod, since a monitor pointed at a 403 would report a healthy
        # Pi-hole as down.
        siteMonitor: https://pihole.cowlab.org/admin/login
