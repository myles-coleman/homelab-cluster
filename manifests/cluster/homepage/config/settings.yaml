title: Cowlab

# `layout` keys are group names, and their order is the group order on the
# page. Every group a service is filed under must appear here — including the
# groups that exist only as HTTPRoute annotations. A group that is missing
# still renders, but untabbed and after these ones.
layout:
  Downloaders:
    style: row
    columns: 4
    tab: Media
  Media:
    style: row
    columns: 2
    tab: Media
  Services:
    style: row
    columns: 4
    tab: Apps
  System:
    style: row
    columns: 4
    tab: Infra

# No `theme:` on purpose: setting it locks the light/dark switcher.
headerStyle: clean
color: slate
# Dots rather than the default badge, because discovered services inherit
# Kubernetes pod state and a wall of green badges drowns that signal out.
statusStyle: dot
quicklaunch:
  searchDescriptions: true

# Longhorn is an *info* widget, not a service widget, so its credentials live here
# rather than on an HTTPRoute annotation. In-cluster and unauthenticated: this
# Longhorn install exposes its frontend API without auth, so the URL is the only
# input and no Secret is involved. Verified reachable at this address from the
# homepage pod before wiring it up.
providers:
  longhorn:
    url: http://longhorn-frontend.longhorn-system.svc.cluster.local
