# API keys for the service widgets.
#
# Homepage reads these as `{{HOMEPAGE_VAR_SONARR_KEY}}` etc. in the card
# definitions, which live on each HTTPRoute's annotations — so the ConfigMap
# stays free of secrets and only the Deployment needs the values, through
# `envFrom`.
#
# Every value is a Vaultwarden secure note whose body is the key, which is the
# convention already in use for `argocd-api-key`. That is why this uses
# `bitwarden-notes`: the store returns the note body as the value, so no
# `remoteRef.property` is involved.
#
# The resulting Secret's keys are named HOMEPAGE_VAR_* directly, so no
# `target.template` is needed — `data[].secretKey` is the Secret key.
#
# Rotation: the *arr apps generate these, and rotating means editing `<ApiKey>`
# in each app's config.xml and restarting it. When that happens the note body
# must be updated to match, and `refreshInterval` picks it up without a redeploy.
#
# Prowlarr's key is staged but no widget consumes it yet. Its pods run a
# kernel-mode tailscale sidecar that drops input arriving anywhere but the
# tailnet, so neither the widget nor the existing card can reach it: the pod IP
# times out from another namespace and `prowlarr.cowlab.org` answers nothing,
# while `http://100.89.60.0:9696` works from a tailnet client. Wiring the widget
# is one annotation once that ingress is fixed; deleting this entry instead is
# also fine if the fix is never made.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: homepage-widgets
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-notes
  target:
    name: homepage-widgets
    creationPolicy: Owner
  data:
    - secretKey: HOMEPAGE_VAR_SONARR_KEY
      remoteRef:
        key: 6e6d4ec3-4a6c-45f1-bf5f-c8dfbe61cc79
    - secretKey: HOMEPAGE_VAR_RADARR_KEY
      remoteRef:
        key: 7acfb085-dd37-46dc-83e0-0f6b28be75d3
    - secretKey: HOMEPAGE_VAR_PROWLARR_KEY
      remoteRef:
        key: d34046b4-36c8-4aad-acf2-8424e7bbd7c9
