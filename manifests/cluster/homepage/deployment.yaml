apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
spec:
  revisionHistoryLimit: 3
  # Two replicas so a single unhealthy node cannot take the portal down. The pod
  # previously ran alone on node1, and node1's kubelet going silent was enough to
  # turn portal.cowlab.org into a 503: the pod's Ready condition follows node
  # readiness, so the endpoint went unready and Traefik had no server to send to.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never drop below the current replica count during a rollout.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage
    spec:
      serviceAccountName: homepage
      automountServiceAccountToken: true
      dnsPolicy: ClusterFirst
      enableServiceLinks: true
      # Prefer different nodes, but never refuse to schedule: with soft affinity a
      # cluster already short on nodes still runs the second replica, which is
      # better than a pod stuck Pending.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: homepage
      containers:
        - name: homepage
          image: "ghcr.io/gethomepage/homepage:v2.8.0@sha256:019d8f063a7299e7c1c51ee4a70b692291809af3244894fbec2c2ac7d1f71b18"
          imagePullPolicy: Always
          env:
            # The kubelet probes `http://<podIP>:3000/...`, so the Host header it
            # sends is the pod IP, which Homepage's host validation rejects with a
            # 400. A 400 is not a dead process, but liveness cannot tell the
            # difference: it restarted the container every ~2.5 minutes, and
            # `maxUnavailable: 0` then kept the previous replicas serving — which is
            # why the dashboard ran on stale config with widget keys missing.
            #
            # This mirrors the upstream Kubernetes example, which sets
            # `HOMEPAGE_ALLOWED_HOSTS=$(MY_POD_IP):3000,gethomepage.dev` for exactly
            # this reason.
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "$(POD_IP):3000,portal.cowlab.org" # required, may need port. See gethomepage.dev/installation/#homepage_allowed_hosts
          # Widget API keys. The card definitions reference them as
          # {{HOMEPAGE_VAR_*}}, which Homepage substitutes at read time, so the
          # Committed ConfigMap never holds a secret and only this Secret does.
          #
          # Not `optional: true`: if External Secrets is down the pods should fail
          # loudly rather than come up with every widget silently broken.
          envFrom:
            - secretRef:
                name: homepage-widgets
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          # /api/healthcheck is on Homepage's public path list, so it answers 200
          # even with HOMEPAGE_AUTH_ENABLED set — the probe does not depend on the
          # auth work that has not been switched on yet.
          #
          # A readiness gate matters more here than usual: the pod previously ran
          # without one, so a replica that had started but could not yet render was
          # still handed traffic, and a rolled node left a 503 until the endpoint
          # controller caught up.
          readinessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 4
          # Sized from observed usage: ~100-150Mi resident per replica at idle on
          # this dashboard, so 192Mi request leaves headroom without reserving a
          # fifth of a node. The limit is 384Mi — a Next.js render spike fits, and
          # an OOM kill here is a single stateless replica, not data loss.
          resources:
            requests:
              cpu: 25m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          volumeMounts:
            - mountPath: /app/config/custom.js
              name: homepage-config
              subPath: custom.js
            - mountPath: /app/config/custom.css
              name: homepage-config
              subPath: custom.css
            - mountPath: /app/config/bookmarks.yaml
              name: homepage-config
              subPath: bookmarks.yaml
            - mountPath: /app/config/docker.yaml
              name: homepage-config
              subPath: docker.yaml
            - mountPath: /app/config/kubernetes.yaml
              name: homepage-config
              subPath: kubernetes.yaml
            - mountPath: /app/config/services.yaml
              name: homepage-config
              subPath: services.yaml
            - mountPath: /app/config/settings.yaml
              name: homepage-config
              subPath: settings.yaml
            - mountPath: /app/config/widgets.yaml
              name: homepage-config
              subPath: widgets.yaml
            - mountPath: /app/config/logs
              name: logs
      volumes:
        - name: homepage-config
          configMap:
            name: homepage
        - name: logs
          emptyDir: {}