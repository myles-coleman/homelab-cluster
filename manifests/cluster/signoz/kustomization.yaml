apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: signoz

resources:
  - namespace.yaml
  - helm-chart.yaml
  - externalsecrets/clickhouse-operator-secret.yaml
  - externalsecrets/clickhouse-admin-secret.yaml
  - externalsecrets/signoz-secrets.yaml

patches:
  # The chart renders this Secret with the default operator credentials in
  # plaintext. Delete it so the ESO-managed Secret of the same name is used.
  - target:
      kind: Secret
      name: signoz-clickhouse-operator
    patch: |-
      apiVersion: v1
      kind: Secret
      metadata:
        name: signoz-clickhouse-operator
      $patch: delete
  - target:
      kind: Deployment
      name: signoz-otel-collector
    patch: |-
      - op: replace
        path: /spec/template/spec/initContainers/0/env
        value:
          - name: CLICKHOUSE_HOST
            value: signoz-clickhouse
          - name: CLICKHOUSE_PORT
            value: "9000"
          - name: CLICKHOUSE_HTTP_PORT
            value: "8123"
          - name: CLICKHOUSE_CLUSTER
            value: "cluster"
          - name: CLICKHOUSE_USER
            valueFrom:
              secretKeyRef:
                name: signoz-clickhouse-admin
                key: username
          - name: CLICKHOUSE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: signoz-clickhouse-admin
                key: password
          - name: CLICKHOUSE_SECURE
            value: "false"
          - name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN
            value: "tcp://$(CLICKHOUSE_USER):$(CLICKHOUSE_PASSWORD)@$(CLICKHOUSE_HOST):$(CLICKHOUSE_PORT)"
          - name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER
            value: $(CLICKHOUSE_CLUSTER)
          - name: SIGNOZ_OTEL_COLLECTOR_TIMEOUT
            value: "10m"
          - name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION
            value: "false"
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - name: CLICKHOUSE_HOST
            value: signoz-clickhouse
          - name: CLICKHOUSE_PORT
            value: "9000"
          - name: CLICKHOUSE_HTTP_PORT
            value: "8123"
          - name: CLICKHOUSE_CLUSTER
            value: "cluster"
          - name: CLICKHOUSE_USER
            valueFrom:
              secretKeyRef:
                name: signoz-clickhouse-admin
                key: username
          - name: CLICKHOUSE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: signoz-clickhouse-admin
                key: password
          - name: CLICKHOUSE_SECURE
            value: "false"
          - name: CLICKHOUSE_DATABASE
            value: "signoz_metrics"
          - name: CLICKHOUSE_TRACE_DATABASE
            value: "signoz_traces"
          - name: CLICKHOUSE_LOG_DATABASE
            value: "signoz_logs"
          - name: CLICKHOUSE_METER_DATABASE
            value: "signoz_meter"
          - name: CLICKHOUSE_VERIFY
            value: "false"
          - name: K8S_NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: K8S_POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: K8S_HOST_IP
            valueFrom:
              fieldRef:
                fieldPath: status.hostIP
          - name: K8S_POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: K8S_POD_UID
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid
          - name: K8S_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: LOW_CARDINAL_EXCEPTION_GROUPING
            value: "false"
          - name: TENANT_ID
            valueFrom:
              secretKeyRef:
                name: signoz-secrets
                key: tenant-id
  - target:
      kind: Job
      name: signoz-telemetrystore-migrator
    patch: |-
      - op: replace
        path: /spec/template/spec/initContainers/0/env
        value:
          - name: CLICKHOUSE_HOST
            value: signoz-clickhouse
          - name: CLICKHOUSE_PORT
            value: "9000"
          - name: CLICKHOUSE_HTTP_PORT
            value: "8123"
          - name: CLICKHOUSE_CLUSTER
            value: "cluster"
          - name: CLICKHOUSE_USER
            valueFrom:
              secretKeyRef:
                name: signoz-clickhouse-admin
                key: username
          - name: CLICKHOUSE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: signoz-clickhouse-admin
                key: password
          - name: CLICKHOUSE_SECURE
            value: "false"
          - name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN
            value: "tcp://$(CLICKHOUSE_USER):$(CLICKHOUSE_PASSWORD)@$(CLICKHOUSE_HOST):$(CLICKHOUSE_PORT)"
          - name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER
            value: $(CLICKHOUSE_CLUSTER)
          - name: SIGNOZ_OTEL_COLLECTOR_TIMEOUT
            value: "10m"
          - name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION
            value: "false"
      - op: replace
        path: /spec/template/spec/initContainers/1/env
        value:
          - name: CLICKHOUSE_HOST
            value: signoz-clickhouse
          - name: CLICKHOUSE_PORT
            value: "9000"
          - name: CLICKHOUSE_HTTP_PORT
            value: "8123"
          - name: CLICKHOUSE_CLUSTER
            value: "cluster"
          - name: CLICKHOUSE_USER
            valueFrom:
              secretKeyRef:
                name: signoz-clickhouse-admin
                key: username
          - name: CLICKHOUSE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: signoz-clickhouse-admin
                key: password
          - name: CLICKHOUSE_SECURE
            value: "false"
          - name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN
            value: "tcp://$(CLICKHOUSE_USER):$(CLICKHOUSE_PASSWORD)@$(CLICKHOUSE_HOST):$(CLICKHOUSE_PORT)"
          - name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER
            value: $(CLICKHOUSE_CLUSTER)
          - name: SIGNOZ_OTEL_COLLECTOR_TIMEOUT
            value: "10m"
          - name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION
            value: "false"
      - op: replace
        path: /spec/template/spec/initContainers/2/env
        value:
          - name: CLICKHOUSE_HOST
            value: signoz-clickhouse
          - name: CLICKHOUSE_PORT
            value: "9000"
          - name: CLICKHOUSE_HTTP_PORT
            value: "8123"
          - name: CLICKHOUSE_CLUSTER
            value: "cluster"
          - name: CLICKHOUSE_USER
            valueFrom:
              secretKeyRef:
                name: signoz-clickhouse-admin
                key: username
          - name: CLICKHOUSE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: signoz-clickhouse-admin
                key: password
          - name: CLICKHOUSE_SECURE
            value: "false"
          - name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN
            value: "tcp://$(CLICKHOUSE_USER):$(CLICKHOUSE_PASSWORD)@$(CLICKHOUSE_HOST):$(CLICKHOUSE_PORT)"
          - name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER
            value: $(CLICKHOUSE_CLUSTER)
          - name: SIGNOZ_OTEL_COLLECTOR_TIMEOUT
            value: "10m"
          - name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION
            value: "false"
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - name: CLICKHOUSE_HOST
            value: signoz-clickhouse
          - name: CLICKHOUSE_PORT
            value: "9000"
          - name: CLICKHOUSE_HTTP_PORT
            value: "8123"
          - name: CLICKHOUSE_CLUSTER
            value: "cluster"
          - name: CLICKHOUSE_USER
            valueFrom:
              secretKeyRef:
                name: signoz-clickhouse-admin
                key: username
          - name: CLICKHOUSE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: signoz-clickhouse-admin
                key: password
          - name: CLICKHOUSE_SECURE
            value: "false"
          - name: CLICKHOUSE_DATABASE
            value: "signoz_metrics"
          - name: CLICKHOUSE_TRACE_DATABASE
            value: "signoz_traces"
          - name: CLICKHOUSE_LOG_DATABASE
            value: "signoz_logs"
          - name: CLICKHOUSE_METER_DATABASE
            value: "signoz_meter"
          - name: CLICKHOUSE_VERIFY
            value: "false"
          - name: K8S_NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: K8S_POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: K8S_HOST_IP
            valueFrom:
              fieldRef:
                fieldPath: status.hostIP
          - name: K8S_POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: K8S_POD_UID
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid
          - name: K8S_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: LOW_CARDINAL_EXCEPTION_GROUPING
            value: "false"
          # The async migrator needs the DSN/cluster/replication settings too.
          # Without these it defaults to tcp://0.0.0.0:9001 and fails. This is
          # a single-shard/replica ClickHouse, so replication must be false.
          - name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN
            value: "tcp://$(CLICKHOUSE_USER):$(CLICKHOUSE_PASSWORD)@$(CLICKHOUSE_HOST):$(CLICKHOUSE_PORT)"
          - name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER
            value: $(CLICKHOUSE_CLUSTER)
          - name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION
            value: "false"
          - name: SIGNOZ_OTEL_COLLECTOR_TIMEOUT
            value: "10m"
  - target:
      kind: StatefulSet
      name: signoz
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - name: CLICKHOUSE_HOST
            value: signoz-clickhouse
          - name: CLICKHOUSE_PORT
            value: "9000"
          - name: CLICKHOUSE_HTTP_PORT
            value: "8123"
          - name: CLICKHOUSE_CLUSTER
            value: "cluster"
          - name: CLICKHOUSE_USER
            valueFrom:
              secretKeyRef:
                name: signoz-clickhouse-admin
                key: username
          - name: CLICKHOUSE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: signoz-clickhouse-admin
                key: password
          - name: CLICKHOUSE_SECURE
            value: "false"
          - name: SIGNOZ_TELEMETRYSTORE_PROVIDER
            value: "clickhouse"
          - name: SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN
            value: "tcp://signoz-clickhouse:9000/?username=$(CLICKHOUSE_USER)&password=$(CLICKHOUSE_PASSWORD)"
          - name: SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_CLUSTER
            value: "cluster"
          - name: SIGNOZ_PROMETHEUS_ACTIVE__QUERY__TRACKER_ENABLED
            value: "false"
          - name: SIGNOZ_ALERTMANAGER_SIGNOZ_EXTERNAL__URL
            value: "http://localhost:8080"
          - name: SIGNOZ_ALERTMANAGER_PROVIDER
            value: "signoz"
          - name: SIGNOZ_TOKENIZER_JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: signoz-secrets
                key: jwt-secret
  - target:
      kind: ClickHouseInstallation
      name: signoz-clickhouse
    patch: |-
      # Drop the chart's plaintext admin password; it is supplied by ESO.
      - op: remove
        path: /spec/configuration/users/admin~1password
      # Cap ClickHouse's internal system logs. text/latency/error/query_metric
      # have no operator-defined engine, so a plain <ttl> is valid. The tables
      # below are declared with an explicit <engine> by the operator, so their
      # TTL must be set inside the engine (a standalone <ttl> is rejected:
      # "If 'engine' is specified... 'ttl' setting doesn't make sense").
      # trace_log previously ran with a 7-day engine TTL and filled the 20Gi
      # volume (18.5GiB in ~6 days).
      - op: replace
        path: /spec/configuration/files/config.d~1system_log.xml
        value: |
          <clickhouse>
            <text_log>
              <ttl>event_date + INTERVAL 3 DAY DELETE</ttl>
            </text_log>
            <latency_log>
              <ttl>event_date + INTERVAL 3 DAY DELETE</ttl>
            </latency_log>
            <error_log>
              <ttl>event_date + INTERVAL 7 DAY DELETE</ttl>
            </error_log>
            <query_metric_log>
              <ttl>event_date + INTERVAL 3 DAY DELETE</ttl>
            </query_metric_log>
            <trace_log replace="1">
              <database>system</database>
              <table>trace_log</table>
              <engine>Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 2 day</engine>
              <flush_interval_milliseconds>7500</flush_interval_milliseconds>
            </trace_log>
            <part_log replace="1">
              <database>system</database>
              <table>part_log</table>
              <engine>Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 3 day</engine>
              <flush_interval_milliseconds>7500</flush_interval_milliseconds>
            </part_log>
            <query_log replace="1">
              <database>system</database>
              <table>query_log</table>
              <engine>Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 3 day</engine>
              <flush_interval_milliseconds>7500</flush_interval_milliseconds>
            </query_log>
            <metric_log replace="1">
              <database>system</database>
              <table>metric_log</table>
              <engine>Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 7 day</engine>
              <flush_interval_milliseconds>7500</flush_interval_milliseconds>
            </metric_log>
            <asynchronous_metric_log replace="1">
              <database>system</database>
              <table>asynchronous_metric_log</table>
              <engine>Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 1 day</engine>
              <flush_interval_milliseconds>7500</flush_interval_milliseconds>
            </asynchronous_metric_log>
          </clickhouse>
      # Give the data volume headroom; Longhorn supports online expansion.
      - op: replace
        path: /spec/templates/volumeClaimTemplates/0/spec/resources/requests/storage
        value: "50Gi"
      # Cap ClickHouse memory so it cannot starve the node (node1 is 4GiB).
      # ClickHouse derives max_server_memory_usage from the cgroup limit.
      - op: add
        path: /spec/templates/podTemplates/0/spec/containers/0/resources/limits
        value:
          memory: 2Gi
