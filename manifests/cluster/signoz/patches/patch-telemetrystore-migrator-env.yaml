      - name: CLICKHOUSE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: signoz-clickhouse-admin
            key: password
      - name: CLICKHOUSE_SECURE
        value: "false"
      - name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN
        value: "tcp://$(CLICKHOUSE_USER):$(CLICKHOUSE_PASSWORD)@$(CLICKHOUSE_HOST):$(CLICKHOUSE_PORT)"
      - name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER
        value: $(CLICKHOUSE_CLUSTER)
      - name: SIGNOZ_OTEL_COLLECTOR_TIMEOUT
        value: "10m"
      - name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION
        value: "true"
  - op: replace
    path: /spec/template/spec/initContainers/2/env
    value:
      - name: CLICKHOUSE_HOST
        value: signoz-clickhouse
      - name: CLICKHOUSE_PORT
        value: "9000"
      - name: CLICKHOUSE_HTTP_PORT
        value: "8123"
      - name: CLICKHOUSE_CLUSTER
        value: "cluster"
      - name: CLICKHOUSE_USER
        valueFrom:
          secretKeyRef:
            name: signoz-clickhouse-admin
            key: username
      - name: CLICKHOUSE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: signoz-clickhouse-admin
            key: password
      - name: CLICKHOUSE_SECURE
        value: "false"
      - name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN
        value: "tcp://$(CLICKHOUSE_USER):$(CLICKHOUSE_PASSWORD)@$(CLICKHOUSE_HOST):$(CLICKHOUSE_PORT)"
      - name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER
        value: $(CLICKHOUSE_CLUSTER)
      - name: SIGNOZ_OTEL_COLLECTOR_TIMEOUT
        value: "10m"
      - name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION
        value: "true"
  - op: replace
    path: /spec/template/spec/containers/0/env
    value:
      - name: CLICKHOUSE_HOST
        value: signoz-clickhouse
      - name: CLICKHOUSE_PORT
        value: "9000"
      - name: CLICKHOUSE_HTTP_PORT
        value: "8123"
      - name: CLICKHOUSE_CLUSTER
        value: "cluster"
      - name: CLICKHOUSE_USER
        valueFrom:
          secretKeyRef:
            name: signoz-clickhouse-admin
            key: username
      - name: CLICKHOUSE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: signoz-clickhouse-admin
            key: password
      - name: CLICKHOUSE_SECURE
        value: "false"
      - name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN
        value: "tcp://$(CLICKHOUSE_USER):$(CLICKHOUSE_PASSWORD)@$(CLICKHOUSE_HOST):$(CLICKHOUSE_PORT)"
      - name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER
        value: $(CLICKHOUSE_CLUSTER)
      - name: SIGNOZ_OTEL_COLLECTOR_TIMEOUT
        value: "10m"
      - name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION
        value: "true"
target:
  kind: Job
  name: signoz-telemetrystore-migrator
