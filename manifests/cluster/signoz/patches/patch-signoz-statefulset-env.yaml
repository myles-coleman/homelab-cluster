apiVersion: patches/v1
kind: Patch
metadata:
  name: patch-signoz-statefulset-env
patch: |-
  - op: replace
    path: /spec/template/spec/containers/0/env
    value:
      - name: CLICKHOUSE_HOST
        value: signoz-clickhouse
      - name: CLICKHOUSE_PORT
        value: "9000"
      - name: CLICKHOUSE_HTTP_PORT
        value: "8123"
      - name: CLICKHOUSE_CLUSTER
        value: "cluster"
      - name: CLICKHOUSE_USER
        valueFrom:
          secretKeyRef:
            name: signoz-clickhouse-admin
            key: username
      - name: CLICKHOUSE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: signoz-clickhouse-admin
            key: password
      - name: CLICKHOUSE_SECURE
        value: "false"
      - name: SIGNOZ_TELEMETRYSTORE_PROVIDER
        value: "clickhouse"
      - name: SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN
        value: "tcp://signoz-clickhouse:9000/?username=$(CLICKHOUSE_USER)&password=$(CLICKHOUSE_PASSWORD)"
      - name: SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_CLUSTER
        value: "cluster"
      - name: SIGNOZ_PROMETHEUS_ACTIVE__QUERY__TRACKER_ENABLED
        value: "false"
      - name: SIGNOZ_ALERTMANAGER_SIGNOZ_EXTERNAL__URL
        value: "http://localhost:8080"
      - name: SIGNOZ_ALERTMANAGER_PROVIDER
        value: "signoz"
target:
  kind: StatefulSet
  name: signoz
