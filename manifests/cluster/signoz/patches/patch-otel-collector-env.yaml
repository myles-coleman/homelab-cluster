apiVersion: patches/v1
kind: Patch
metadata:
  name: patch-otel-collector-env
patch: |-
  - op: replace
    path: /spec/template/spec/initContainers/0/env
    value:
      - name: CLICKHOUSE_HOST
        value: signoz-clickhouse
      - name: CLICKHOUSE_PORT
        value: "9000"
      - name: CLICKHOUSE_HTTP_PORT
        value: "8123"
      - name: CLICKHOUSE_CLUSTER
        value: "cluster"
      - name: CLICKHOUSE_USER
        valueFrom:
          secretKeyRef:
            name: signoz-clickhouse-admin
            key: username
      - name: CLICKHOUSE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: signoz-clickhouse-admin
            key: password
      - name: CLICKHOUSE_SECURE
        value: "false"
      - name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN
        value: "tcp://$(CLICKHOUSE_USER):$(CLICKHOUSE_PASSWORD)@$(CLICKHOUSE_HOST):$(CLICKHOUSE_PORT)"
      - name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER
        value: $(CLICKHOUSE_CLUSTER)
      - name: SIGNOZ_OTEL_COLLECTOR_TIMEOUT
        value: "10m"
      - name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION
        value: "true"
  - op: replace
    path: /spec/template/spec/containers/0/env
    value:
      - name: CLICKHOUSE_HOST
        value: signoz-clickhouse
      - name: CLICKHOUSE_PORT
        value: "9000"
      - name: CLICKHOUSE_HTTP_PORT
        value: "8123"
      - name: CLICKHOUSE_CLUSTER
        value: "cluster"
      - name: CLICKHOUSE_USER
        valueFrom:
          secretKeyRef:
            name: signoz-clickhouse-admin
            key: username
      - name: CLICKHOUSE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: signoz-clickhouse-admin
            key: password
      - name: CLICKHOUSE_SECURE
        value: "false"
      - name: CLICKHOUSE_DATABASE
        value: "signoz_metrics"
      - name: CLICKHOUSE_TRACE_DATABASE
        value: "signoz_traces"
      - name: CLICKHOUSE_LOG_DATABASE
        value: "signoz_logs"
      - name: CLICKHOUSE_METER_DATABASE
        value: "signoz_meter"
      - name: CLICKHOUSE_VERIFY
        value: "false"
      - name: K8S_NODE_NAME
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName
      - name: K8S_POD_IP
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
      - name: K8S_HOST_IP
        valueFrom:
          fieldRef:
            fieldPath: status.hostIP
      - name: K8S_POD_NAME
        valueFrom:
          fieldRef:
            fieldPath: metadata.name
      - name: K8S_POD_UID
        valueFrom:
          fieldRef:
            fieldPath: metadata.uid
      - name: K8S_NAMESPACE
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace
      - name: LOW_CARDINAL_EXCEPTION_GROUPING
        value: "false"
target:
  kind: Deployment
  name: signoz-otel-collector
