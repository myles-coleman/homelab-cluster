global:
  storageClass: longhorn

clickhouse:
  persistence:
    storageClass: longhorn

  # ClickHouse's own diagnostic logs cost more to merge than they are worth on
  # this node. Measured on 2026-11-05 (spec 27, `27-merge-backlog-investigation`):
  # `system.metric_log` alone produced 14,248 merge-seconds in 30 minutes across
  # 5,054 merges to yield 51 MiB, because it collects every server metric once a
  # second into a ~1,000-column row and flushes every 7.5s. With
  # `system.query_metric_log` it held ~2.2 of the 4 cores on `node4`, leaving 7%
  # headroom where the v0.149.0 dual-ingest change needs 15%.
  #
  # This is a separate file, not an edit to `system_log.xml`, on purpose: that
  # file's current value is owned by a `kubectl-patch` field manager (it was
  # applied in the cluster after `zookeeper_log` filled a 20Gi volume), so
  # ArgoCD's server-side apply cannot change it. A new key can be added, and
  # ClickHouse merges config.d in lexical order, so `zz-` wins over both
  # `system_log.xml` and the operator's `01-clickhouse-11-metric_log.xml`.
  # Reconciling that drift is a separate follow-up.
  #
  # Collect and flush both metric logs every 60s. The merge pool is left
  # alone: `background_pool_size` below 20 breaks
  # `number_of_free_entries_in_pool_to_execute_mutation` and ClickHouse will
  # not start (learned the hard way in #79).
  files:
    config.d/zz-signoz-metric-logs.xml: |
      <clickhouse>
        <metric_log replace="1">
          <database>system</database>
          <table>metric_log</table>
          <engine>Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 7 day</engine>
          <flush_interval_milliseconds>60000</flush_interval_milliseconds>
          <collect_interval_milliseconds>60000</collect_interval_milliseconds>
        </metric_log>
        <query_metric_log replace="1">
          <database>system</database>
          <table>query_metric_log</table>
          <engine>Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 3 day</engine>
          <flush_interval_milliseconds>60000</flush_interval_milliseconds>
          <collect_interval_milliseconds>60000</collect_interval_milliseconds>
        </query_metric_log>
      </clickhouse>

signoz:
  persistence:
    storageClass: longhorn
