apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: signoz-secrets
  namespace: signoz
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-notes
  target:
    name: signoz-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: jwt-secret
    remoteRef:
      key: 7788797c-00c2-4e4e-91e9-0ada97ba19b2
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: tenant-id
    remoteRef:
      key: a975221d-8b20-4bb0-b32a-54592d51a300
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
