apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: node-exporter
  labels:
    app.kubernetes.io/name: node-exporter
    app.kubernetes.io/component: metrics
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-exporter
        app.kubernetes.io/component: metrics
      annotations:
        # Discovered by the signoz-k8s-infra prometheus preset (pod role).
        # Scrape is scoped to the node-exporter namespace in that release's values.
        signoz.io/scrape: "true"
        signoz.io/port: "9100"
        signoz.io/path: "/metrics"
    spec:
      # hostPID plus host mounts let node_exporter read the host's sysfs/procfs.
      hostPID: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      tolerations:
        # node0 is a control-plane node tainted CriticalAddonsOnly.
        - key: CriticalAddonsOnly
          operator: Equal
          value: "true"
          effect: NoExecute
        # node4 carries the GPU taint.
        - key: gpu
          operator: Equal
          value: amd
          effect: NoSchedule
        # Match the other DaemonSets in this cluster for node conditions.
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 300
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 300
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/memory-pressure
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/pid-pressure
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/unschedulable
          operator: Exists
          effect: NoSchedule
      containers:
        - name: node-exporter
          # node_exporter v1.12.1 (multiarch, linux/arm64 present). Pinned to the
          # manifest-list digest so every node resolves the same build.
          image: quay.io/prometheus/node-exporter@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
          args:
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            - --path.rootfs=/host/root
            # Only emit the two collectors that are not already covered by the
            # k8s-infra hostMetrics preset. This avoids duplicate host series.
            - --collector.disable-defaults
            - --collector.thermal_zone
            - --collector.cpufreq
          ports:
            - name: metrics
              containerPort: 9100
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: root
              mountPath: /host/root
              readOnly: true
              mountPropagation: HostToContainer
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: root
          hostPath:
            path: /
