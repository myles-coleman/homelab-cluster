apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: sonarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sonarr
  # The volumes this Deployment mounts are Longhorn ReadWriteOnce, so a new pod
  # cannot attach them while the old pod still holds them. maxSurge 0 terminates
  # the old pod first; maxUnavailable 1 allows that. `type: Recreate` would say
  # the same thing but is rejected by the API, because the live Deployment keeps
  # its default rollingUpdate fields and both cannot be set at once.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      containers:
      - name: sonarr
        image: lscr.io/linuxserver/sonarr:version-4.0.20.3014@sha256:c7d1df25e428da6c9ace05daea0d34e59522978a3843ea1944812f855af4086c
        env:
        - name: TZ
          value: "Etc/UTC"
        ports:
        - containerPort: 8989
        resources:
          limits:
            memory: "1024Mi"
            cpu: "500m"
          requests:
            memory: "512Mi"
            cpu: "250m"
        volumeMounts:
        - name: data-volume
          mountPath: /data
        - name: config-volume
          mountPath: /config
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: sonarr-data
      - name: config-volume
        persistentVolumeClaim:
          claimName: sonarr-config
