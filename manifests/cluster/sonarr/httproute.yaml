apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonarr
  namespace: sonarr
  annotations:
    gethomepage.dev/description: TV Show Collection Manager
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Downloaders
    gethomepage.dev/icon: sonarr.svg
    gethomepage.dev/name: Sonarr
    gethomepage.dev/pod-selector: "app=sonarr"
    gethomepage.dev/weight: "20"
    # In-cluster URL, not the public hostname: the widget talks to the pod
    # directly, so a broken Traefik route cannot also break the card's metrics.
    gethomepage.dev/widget.type: sonarr
    gethomepage.dev/widget.url: http://sonarr.sonarr.svc.cluster.local:8989
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
    gethomepage.dev/widget.enableQueue: "true"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - sonarr.cowlab.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: sonarr
          port: 8989
          weight: 1
