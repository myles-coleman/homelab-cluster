# The bearer key Strata serves /metrics with.
#
# Same Vaultwarden item as `agent-sandbox/opencode-sandbox-secrets`, but the
# ExternalSecret is namespaced and ESO does not copy Secrets across namespaces.
# Keeping it separate also means the collector can be deleted without touching
# the sandbox's own credential.
#
# ⚠️ Strata content-negotiates on Accept. `curl` without one (or with `*/*`)
# receives the JSON snapshot; the prometheus receiver's default Accept asks for
# OpenMetrics/text and receives the parseable payload. Keep that in mind when
# debugging by hand.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sandbox-telemetry-strata
  namespace: sandbox-telemetry
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-notes
  target:
    name: sandbox-telemetry-strata
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: api_key
      remoteRef:
        key: d7fae6eb-9ce4-46f5-a0bf-3585692fe49d
