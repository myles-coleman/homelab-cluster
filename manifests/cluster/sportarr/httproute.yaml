apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sportarr
  namespace: sportarr
  annotations:
    gethomepage.dev/description: Sports Event Collection Manager
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Downloaders
    gethomepage.dev/icon: sportarr.svg
    gethomepage.dev/name: Sportarr
    gethomepage.dev/pod-selector: "app=sportarr"
    gethomepage.dev/weight: "60"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - sportarr.cowlab.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: sportarr
          port: 1867
          weight: 1
