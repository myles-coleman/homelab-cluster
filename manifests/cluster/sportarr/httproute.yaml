apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sportarr
  namespace: sportarr
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - sportarr.cowlab.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: sportarr
          port: 1867
          weight: 1
