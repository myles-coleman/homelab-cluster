apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatus
  namespace: gatus
spec:
  # One replica: SQLite on a Longhorn ReadWriteOnce volume, and there is no
  # leader election, so a second pod would fight over the database file.
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: gatus
  # maxSurge 0 / maxUnavailable 1 because the volume is ReadWriteOnce and a
  # replacement pod cannot attach it while the old one still holds it.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: gatus
    spec:
      securityContext:
        # Gives the SQLite path a writable group regardless of the uid the image
        # ships with, so a config change that rolls the pod does not land on a
        # root-owned database file.
        fsGroup: 1000
      containers:
        - name: gatus
          # Multi-arch index; arm64 is present, so it schedules on the Pi 5 nodes.
          image: "ghcr.io/twin/gatus:stable@sha256:085ed63da963728965d00a3c78aa6167e3bf135218485b893201758e079e8415"
          imagePullPolicy: IfNotPresent
          env:
            - name: GATUS_CONFIG_PATH
              value: /config/config.yaml
            - name: TZ
              value: America/Los_Angeles
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
          # /health is Gatus's own liveness route and does no work, so it is a
          # cheap probe and needs no authentication.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: gatus-config
        - name: data
          persistentVolumeClaim:
            claimName: gatus-data
