global:
  clusterName: homelab-cluster

# Send telemetry to the SigNoz otel-collector in the signoz namespace.
otelCollectorEndpoint: http://signoz-otel-collector.signoz.svc.cluster.local:4318
otelInsecure: true

presets:
  # Node, pod and container metrics via kubeletstats + host metrics.
  kubeletMetrics:
    enabled: true
  clusterMetrics:
    enabled: true
  hostMetrics:
    enabled: true
  kubernetesAttributes:
    enabled: true
  # Kubernetes events as logs. Disabled (spec 26): events are high-churn and
  # no dashboard here charts them, so they only add write and merge load.
  k8sEvents:
    enabled: false
  # Container logs via filelog. Exclude the noisy control-plane namespaces and
  # SigNoz's own logs to keep ingestion/storage bounded.
  logsCollection:
    enabled: true
    blacklist:
      enabled: true
      signozLogs: true
      namespaces:
        - kube-system
        - longhorn-system
        - cert-manager
        # The sandbox collector's own logs. It is a telemetry producer, not a
        # workload anyone alerts on; `kubectl logs` is the debugging path and
        # this avoids a self-ingestion series that only grows with retries.
        - sandbox-telemetry
      pods: []
      containers: []
  # Scrape Prometheus endpoints discovered via pod annotations. Scoped to the
  # node-exporter namespace so only node_exporter is scraped; ClickHouse,
  # Zookeeper and the SigNoz collector are intentionally left out.
  prometheus:
    enabled: true
    namespaces:
      - node-exporter
    scrapeInterval: 60s
    includePodLabel: false
    includeContainerName: false

otelAgent:
  # Run the agent on every node. Tolerate the GPU taint (node4) and the usual
  # node conditions. node0's CriticalAddonsOnly taint is intentionally not
  # tolerated, matching the other DaemonSets in this cluster.
  tolerations:
    - key: gpu
      operator: Equal
      value: amd
      effect: NoSchedule
    - key: node.kubernetes.io/not-ready
      operator: Exists
      effect: NoExecute
      tolerationSeconds: 300
    - key: node.kubernetes.io/unreachable
      operator: Exists
      effect: NoExecute
      tolerationSeconds: 300
    - key: node.kubernetes.io/disk-pressure
      operator: Exists
      effect: NoSchedule
    - key: node.kubernetes.io/memory-pressure
      operator: Exists
      effect: NoSchedule
    - key: node.kubernetes.io/pid-pressure
      operator: Exists
      effect: NoSchedule
    - key: node.kubernetes.io/unschedulable
      operator: Exists
      effect: NoSchedule
    # node0 is a control-plane node tainted CriticalAddonsOnly; tolerate it so
    # its kubelet metrics/logs are collected too.
    - key: CriticalAddonsOnly
      operator: Equal
      value: "true"
      effect: NoExecute
    # The agent sandbox node is deliberately tainted so only the sandbox and the
    # telemetry agents that must watch it land there. Without this toleration the
    # agent never runs on the one node the sandbox telemetry (spec 19 / issue #74)
    # is about: no kubeletstats for the sandbox pod, no host metrics for the
    # guest, and no filelog for its container output.
    - key: sandbox
      operator: Equal
      value: gvisor
      effect: NoSchedule
  resources:
    # Extra headroom for the prometheus receiver scraping node_exporter.
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi

  # ── Agent telemetry bounds (spec 02, Unit 2) ───────────────────────────────
  # The sandbox pushes OTLP traces and logs to this agent's 4318 receiver. The
  # statements below delete prompt-shaped and credential-shaped attributes and
  # cap everything else, so a future OpenCode release cannot flood ClickHouse
  # with content. Every statement is scoped: the pipeline also carries other
  # pods' telemetry.
  #
  # Written against otel/opentelemetry-collector-contrib:0.139.0 (k8s-infra
  # chart 0.17.1). `transform` is used instead of `filter` because
  # `filter.trace_conditions` needs collector >= 0.146.
  #
  # Note on the two log shapes: OTLP records from the sandbox carry
  # `deployment.environment` but no `k8s.namespace.name` (the SDK resource has
  # no k8s.pod.uid, so k8sattributes cannot join it). `filelog` records carry
  # the namespace and no `service.name`. Log statements therefore match either.
  config:
    processors:
      transform/agent_telemetry:
        # `propagate` (the default) would drop the whole batch on one odd value.
        error_mode: ignore
        trace_statements:
          - context: span
            statements:
              - delete_matching_keys(attributes, "^(ai|gen_ai)\\.(prompt|response|input|output|system|completion)") where resource.attributes["deployment.environment"] == "agent-sandbox"
              - delete_matching_keys(attributes, "(?i)^(authorization|proxy-authorization|api[_-]?key|apikey|access[_-]?token|token|secret|password|passwd|bearer)$") where resource.attributes["deployment.environment"] == "agent-sandbox"
              - truncate_all(attributes, 512) where resource.attributes["deployment.environment"] == "agent-sandbox"
        log_statements:
          - context: log
            statements:
              - truncate_all(attributes, 2048) where resource.attributes["deployment.environment"] == "agent-sandbox" or resource.attributes["k8s.namespace.name"] == "agent-sandbox"
              - delete_matching_keys(attributes, "(?i)^(authorization|proxy-authorization|api[_-]?key|apikey|access[_-]?token|token|secret|password|passwd|bearer)$") where resource.attributes["deployment.environment"] == "agent-sandbox" or resource.attributes["k8s.namespace.name"] == "agent-sandbox"
    # `processors` under a pipeline is a replacing key: setting it drops the
    # chart's preset defaults, so the two preset processors and `batch` are
    # re-listed in order. The rendered chart is the source of truth for what
    # actually ships; review the `helmfile template` diff, not this comment.
    service:
      pipelines:
        traces:
          processors:
            - resourcedetection
            - k8sattributes
            - transform/agent_telemetry
            - batch
        logs:
          processors:
            - resourcedetection
            - k8sattributes
            - transform/agent_telemetry
            - batch

otelDeployment:
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      memory: 256Mi
