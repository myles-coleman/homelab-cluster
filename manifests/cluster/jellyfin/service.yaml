# Jellyfin runs on the homelab host (10.0.0.150), not in the cluster, so this
# Service has no selector: the backing address comes from the EndpointSlice
# beside it. Traefik proxies to whichever address that slice carries.
#
# This replaces the previous ExternalName Service. ExternalName resolution is
# disabled on the Traefik CRD provider (allowExternalNameServices: false), so an
# ExternalName would resolve and then be refused.
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  ports:
    - name: http
      port: 8096
      targetPort: 8096
      protocol: TCP
