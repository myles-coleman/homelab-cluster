apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: youtube
  namespace: youtube-proxy
  annotations:
    gethomepage.dev/description: Account-free YouTube Frontend
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Services
    gethomepage.dev/icon: youtube.svg
    gethomepage.dev/name: YouTube
    gethomepage.dev/pod-selector: "app=materialious"
    gethomepage.dev/weight: "40"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - youtube.cowlab.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: materialious
          port: 3000
          weight: 1
