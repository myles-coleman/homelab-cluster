apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: materialious
  namespace: youtube-proxy
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`youtube.cowlab.org`)
      kind: Rule
      services:
        - name: materialious
          port: 3000
  tls:
    certResolver: letsencrypt
