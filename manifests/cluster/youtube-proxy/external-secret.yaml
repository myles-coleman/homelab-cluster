apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: materialious-secrets
  namespace: youtube-proxy
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-notes
  target:
    name: materialious-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # Signs authentication cookies. Materialious refuses to start unless this
        # is at least 16 characters. Generate with: openssl rand -hex 32
        COOKIE_SECRET: '{{ .MATERIALIOUS_COOKIE_SECRET }}'
  data:
    # Secure note in Vaultwarden: "youtube-proxy / materialious COOKIE_SECRET".
    # Body is a single openssl rand -hex 32 string, no trailing newline.
    - secretKey: MATERIALIOUS_COOKIE_SECRET
      remoteRef:
        key: c3d57706-a2a9-43f7-a00f-b46fe8fe3d6d
