# Canonical forward-auth gate definition.
#
# This object is NOT what protects traffic: Traefik's Gateway API provider
# resolves an HTTPRoute's `ExtensionRef` in the route's own namespace, so each
# protected namespace needs its own copy. This file is the reference those
# copies are kept identical to; edit here first, then mirror the change.
#
# Do not try to reference this object from another namespace: there is no
# `namespace` field on Gateway API's `ExtensionRef`, and the miss shows up as
# `middleware "<route-ns>-authentik@kubernetescrd" does not exist` with a 404
# for every request.
#
# trustForwardHeader is deliberately not set. It is deprecated in Traefik v3.7,
# and enabling it would let a client supply its own X-Forwarded-Host, which is
# how the outpost decides which application is being authorised.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik
  namespace: traefik
spec:
  forwardAuth:
    address: http://authentik-outpost.authentik.svc.cluster.local:9000/outpost.goauthentik.io/auth/traefik
    authRequestHeaders:
      - Cookie
      - X-Forwarded-Method
      - X-Forwarded-Proto
      - X-Forwarded-Host
      - X-Forwarded-Uri
      - X-Forwarded-For
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
