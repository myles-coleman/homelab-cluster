# The single forward-auth gate. Every protected HTTPRoute references this object
# through an ExtensionRef filter; there is no per-application copy, so the
# security-critical configuration cannot drift between services.
#
# Cross-namespace references from the routes are permitted by the ReferenceGrant
# beside this file. Traefik watches referencegrants (its ClusterRole includes
# get/list/watch on them), so a route in another namespace can point here.
#
# trustForwardHeader is deliberately not set. It is deprecated in Traefik v3.7,
# and enabling it would let a client supply its own X-Forwarded-Host, which is
# how the outpost decides which application is being authorised.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik
  namespace: traefik
spec:
  forwardAuth:
    address: http://authentik-outpost.authentik.svc.cluster.local:9000/outpost.goauthentik.io/auth/traefik
    authRequestHeaders:
      - Cookie
      - X-Forwarded-Method
      - X-Forwarded-Proto
      - X-Forwarded-Host
      - X-Forwarded-Uri
      - X-Forwarded-For
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
