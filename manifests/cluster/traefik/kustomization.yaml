apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: traefik

resources:
  - namespace.yaml
  - crds-traefik.yaml
  - crds-gateway-api.yaml
  - helm-chart.yaml
  - tls-store.yaml
  # Shared Authentik forward-auth gate, referenced by HTTPRoutes in other
  # namespaces through a ReferenceGrant.
  - middleware-authentik.yaml
  # Permits those references. Gateway API has no namespace wildcard, so each
  # protected namespace is listed in the grant.
  - referencegrant-authentik.yaml
