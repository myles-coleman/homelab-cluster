# Traefik Helm Chart Values
# Version: v42.4.0
#
# Chart 42 enforces a strict JSON schema (since 39.0.0), so keys the chart has
# removed fail the render instead of being ignored. This file is written
# against the 42.4.0 values surface, not the 33.2.1 one.

global:
  # Replaces the chart-33 globalArguments flags.
  checkNewVersion: false
  sendAnonymousUsage: false

# Log level is a first-class value in chart 42. The old additionalArguments list
# carried it twice; the duplicate is gone with the list.
log:
  level: INFO

# Backend TLS verification is deliberately left at the chart default (verify).
# The previous `additionalArguments: --serversTransport.insecureSkipVerify=true`
# existed only for the pikvm route, which spec 04 retires. Reintroducing it
# needs a written justification, not a flag.

deployment:
  enabled: true
  replicas: 1

# Chart 42 names this `updateStrategy`; there is no `deployment.strategy` key.
# The pin is load-bearing: with maxUnavailable 0 a surge pod that cannot
# schedule turns the rollout into a silent no-op while ArgoCD still reports
# Synced, which is exactly the failure this cluster's memory pressure invites.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

# Ports configuration
ports:
  web:
    # Redirect HTTP to HTTPS
    http:
      redirections:
        entryPoint:
          # Chart 42 validates `to` against entrypoint names ("Cannot redirect
          # web to :443: entryPoint not found"), then renders the entrypoint's
          # service port: `to: websecure` becomes `to=:443` in the args, so the
          # Location header never carries :8443.
          to: websecure
          scheme: https
          priority: 10
  websecure:
    # Enable HTTP/3 (QUIC). Chart 42 nests advertisedPort under http3; the
    # chart-33 top-level `ports.websecure.advertisedPort` is schema-invalid.
    http3:
      enabled: true
      advertisedPort: 4443
    http:
      tls:
        enabled: true

# The dashboard/API is served on the internal `traefik` entrypoint (8080).
# That port is not published by the Service, so this stays cluster-internal and
# only reachable through `kubectl port-forward`; it exists so route state can be
# inspected (`/api/http/routers`) without creating a dashboard IngressRoute.
api:
  dashboard: true
  insecure: true

# Disable default dashboard IngressRoute (we'll create our own)
ingressRoute:
  dashboard:
    enabled: false

# Providers
providers:
  kubernetesCRD:
    enabled: true
    ingressClass: traefik-external
    allowExternalNameServices: true
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: true
    allowExternalNameServices: true
    publishedService:
      enabled: false
  kubernetesGateway:
    enabled: true

# Gateway API. The chart renders GatewayClass/traefik and Gateway/traefik-gateway
# in this namespace from the listeners below.
#
# ESCAPE HATCH (pre-agreed): if chart-rendered Gateway output regresses, set
# `gateway.enabled: false` and commit a hand-written ~10-line Gateway into this
# same kustomization. Do not simply delete the GatewayClass while a Gateway
# references it: the gateway-exists-finalizer blocks the deletion and hangs the
# sync.
gatewayClass:
  enabled: true

gateway:
  enabled: true
  listeners:
    # Listener ports are the IN-POD entrypoint ports (8000/8443), never the
    # Service ports (80/443). The chart fails the render if a listener port is
    # not declared in `ports` above.
    web:
      port: 8000
      protocol: HTTP
      # Defaults to Same, which would silently detach every route in another
      # namespace. This is the Gateway API equivalent of allowCrossNamespace.
      namespacePolicy:
        from: All
    websecure:
      port: 8443
      protocol: HTTPS
      # The chart hard-fails an HTTPS listener without certificateRefs. The
      # Secret lives in this namespace, so no ReferenceGrant is needed.
      mode: Terminate
      certificateRefs:
        # group is stated explicitly: the API server defaults it to "", and an
        # omitted field reads as perpetual OutOfSync against the live object.
        - group: ""
          kind: Secret
          name: cowlab-production-tls
      namespacePolicy:
        from: All

# RBAC
rbac:
  enabled: true

# Service configuration
service:
  enabled: true
  spec:
    type: LoadBalancer
    # This IP should be from your MetalLB range (10.0.0.80-10.0.0.99)
    loadBalancerIP: 10.0.0.99

# Resources
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
