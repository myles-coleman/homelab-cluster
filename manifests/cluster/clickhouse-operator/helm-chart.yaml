# Source: altinity-clickhouse-operator/templates/hooks/crd-install-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: clickhouse-operator-altinity-clickhouse-operator-crd-install
  namespace: clickhouse-operator
  labels:
    helm.sh/chart: altinity-clickhouse-operator-0.27.3
    app.kubernetes.io/name: altinity-clickhouse-operator
    app.kubernetes.io/instance: clickhouse-operator
    app.kubernetes.io/version: "0.27.3"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: crd-install-hook
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      name: clickhouse-operator-altinity-clickhouse-operator-crd-install
      labels:
        helm.sh/chart: altinity-clickhouse-operator-0.27.3
        app.kubernetes.io/name: altinity-clickhouse-operator
        app.kubernetes.io/instance: clickhouse-operator
        app.kubernetes.io/version: "0.27.3"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: crd-install-hook
    spec:
      serviceAccountName: clickhouse-operator-altinity-clickhouse-operator-crd-install
      restartPolicy: OnFailure
      containers:
      - name: crd-install
        image: "bitnami/kubectl:latest"
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "Installing/Updating ClickHouse Operator CRDs..."
          for crd_file in /crds/*/*.yaml; do
            echo "Applying $(basename $crd_file)..."
            kubectl apply --server-side=true --force-conflicts -f "$crd_file"
          done
          echo "CRD installation completed successfully"
        volumeMounts:
        - name: crds-1
          mountPath: /crds/1
          readOnly: true
        - name: crds-2
          mountPath: /crds/2
          readOnly: true
      volumes:
      - name: crds-1
        configMap:
          name: clickhouse-operator-altinity-clickhouse-operator-crds-1
      - name: crds-2
        configMap:
          name: clickhouse-operator-altinity-clickhouse-operator-crds-2

