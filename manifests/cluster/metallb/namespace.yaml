# Pod Security Admission is explicit rather than inherited.
#
# Measured exception: the MetalLB speaker is hostNetwork with NET_RAW to
# answer ARP for the LoadBalancer VIP.
apiVersion: v1
kind: Namespace
metadata:
  name: metallb-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged