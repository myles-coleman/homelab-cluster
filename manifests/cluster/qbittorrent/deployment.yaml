apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: qbittorrent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      initContainers:
      # Native sidecar. Joins the tailnet and forces all pod egress through
      # protecli-vault, which serves as the tailnet exit node and sends that
      # traffic out through its single Mullvad WireGuard tunnel. This replaces
      # the per-app Mullvad config: the only Mullvad device is the Vault.
      - name: tailscale
        image: tailscale/tailscale:stable
        restartPolicy: Always
        env:
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef:
              name: tailscale-auth
              key: authkey
        - name: TS_STATE_DIR
          value: /var/lib/tailscale
        - name: TS_USERSPACE
          value: "false"
        # Use the tailnet's global DNS (Pi-hole, set to apply with the exit
        # node). Cluster-internal names do not resolve in this pod; qBittorrent
        # only needs public DNS.
        - name: TS_ACCEPT_DNS
          value: "true"
        - name: TS_HOSTNAME
          value: qbittorrent-egress
        - name: TS_EXTRA_ARGS
          value: "--exit-node=protecli-vault --exit-node-allow-lan-access"
        securityContext:
          capabilities:
            add: ["NET_ADMIN"]
        resources:
          limits:
            memory: "256Mi"
            cpu: "200m"
          requests:
            memory: "64Mi"
            cpu: "50m"
        startupProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - tailscale status --json | grep -Eq '"BackendState":[[:space:]]*"Running"'
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - tailscale status --json | grep -Eq '"BackendState":[[:space:]]*"Running"'
          periodSeconds: 10
        volumeMounts:
        - name: tailscale-state
          mountPath: /var/lib/tailscale
        - name: dev-net-tun
          mountPath: /dev/net/tun
      containers:
      - name: qbittorrent
        image: lscr.io/linuxserver/qbittorrent:latest
        startupProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - |
              # Wait for the sidecar to bring tailscale0 up with an address.
              ip link show tailscale0 | grep -q "LOWER_UP" && \
              ip addr show tailscale0 | grep -q "inet" || exit 1
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60
        env:
        - name: TZ
          value: "America/Los_Angeles"
        - name: WEBUI_PORT
          value: "8080"
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        resources:
          limits:
            memory: "1Gi"
            cpu: "500m"
          requests:
            memory: "512Mi"
            cpu: "250m"
        ports:
        - containerPort: 8080
          name: webui
        volumeMounts:
        - name: config-volume
          mountPath: /config
        - name: data-nfs-volume
          mountPath: /data
      volumes:
      - name: config-volume
        persistentVolumeClaim:
          claimName: qbittorrent-config
      - name: data-nfs-volume
        persistentVolumeClaim:
          claimName: qbittorrent-data-nfs
      - name: tailscale-state
        persistentVolumeClaim:
          claimName: qbittorrent-tailscale-state
      - name: dev-net-tun
        hostPath:
          path: /dev/net/tun
          type: CharDevice
