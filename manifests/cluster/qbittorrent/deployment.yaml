apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: qbittorrent
spec:
  replicas: 1
  # The Longhorn config volume is ReadWriteOnce. maxSurge 0 stops the new pod
  # from starting before the old one releases the volume; maxUnavailable 1 lets
  # the old pod terminate first. type Recreate is rejected by the API because
  # the live Deployment retains the default rollingUpdate fields.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      # Neither container talks to the Kubernetes API. Drop the token so a
      # compromised app cannot read the tailscale-auth Secret.
      automountServiceAccountToken: false
      initContainers:
      # Pod-level kill switch. Only root (tailscaled) may use the pod network
      # directly; the app (uid 1000) may reach only the tailnet interface or
      # in-cluster CIDRs. If the Tailscale sidecar dies and the exit-node route
      # disappears, qBittorrent falls back to eth0 and is dropped here instead
      # of leaking to the ISP. Rules live in the pod netns for the pod's life.
      - name: killswitch
        image: tailscale/tailscale:stable
        command:
        - /bin/sh
        - -c
        - |
          set -eu
          # The image's `iptables` symlink points at the legacy backend, which
          # the nodes' nftables-only kernel rejects. Use the nft backend.
          IPT=iptables-nft
          IP6T=ip6tables-nft
          command -v "$IPT" >/dev/null 2>&1 || IPT=iptables
          command -v "$IP6T" >/dev/null 2>&1 || IP6T=ip6tables
          "$IPT" -A OUTPUT -o lo -j ACCEPT
          "$IPT" -A OUTPUT -o tailscale0 -j ACCEPT
          "$IPT" -A OUTPUT -d 10.42.0.0/16 -j ACCEPT
          "$IPT" -A OUTPUT -d 10.43.0.0/16 -j ACCEPT
          "$IPT" -A OUTPUT -m owner --uid-owner 0 -j ACCEPT
          "$IPT" -A OUTPUT -j DROP
          if [ -d /proc/sys/net/ipv6 ]; then
            "$IP6T" -A OUTPUT -o lo -j ACCEPT
            "$IP6T" -A OUTPUT -o tailscale0 -j ACCEPT
            "$IP6T" -A OUTPUT -m owner --uid-owner 0 -j ACCEPT
            "$IP6T" -A OUTPUT -j DROP
          fi
        securityContext:
          capabilities:
            add: ["NET_ADMIN"]
        resources:
          limits:
            memory: "64Mi"
            cpu: "100m"
          requests:
            memory: "16Mi"
            cpu: "25m"
      # Native sidecar. Joins the tailnet and forces all pod egress through
      # protecli-vault, which serves as the tailnet exit node and sends that
      # traffic out through its single Mullvad WireGuard tunnel. This replaces
      # the per-app Mullvad config: the only Mullvad device is the Vault.
      - name: tailscale
        image: tailscale/tailscale:stable
        restartPolicy: Always
        env:
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef:
              name: tailscale-auth
              key: authkey
        # Use the PVC for state. Without this, containerboot defaults to a
        # Kubernetes Secret and needs the service-account namespace file, which
        # automountServiceAccountToken=false removes.
        - name: TS_KUBE_SECRET
          value: ""
        - name: TS_STATE_DIR
          value: /var/lib/tailscale
        - name: TS_USERSPACE
          value: "false"
        # Use the tailnet's global DNS (Pi-hole, set to apply with the exit
        # node). Cluster-internal names do not resolve in this pod; qBittorrent
        # only needs public DNS.
        - name: TS_ACCEPT_DNS
          value: "true"
        - name: TS_HOSTNAME
          value: qbittorrent-egress
        - name: TS_EXTRA_ARGS
          value: "--exit-node=protecli-vault --exit-node-allow-lan-access"
        securityContext:
          capabilities:
            add: ["NET_ADMIN"]
        resources:
          limits:
            memory: "256Mi"
            cpu: "200m"
          requests:
            memory: "64Mi"
            cpu: "50m"
        startupProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - tailscale status --json | grep -Eq '"BackendState":[[:space:]]*"Running"'
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - tailscale status --json | grep -Eq '"BackendState":[[:space:]]*"Running"'
          periodSeconds: 10
        volumeMounts:
        - name: tailscale-state
          mountPath: /var/lib/tailscale
        - name: dev-net-tun
          mountPath: /dev/net/tun
      containers:
      - name: qbittorrent
        image: lscr.io/linuxserver/qbittorrent:latest
        startupProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - |
              # Wait for the sidecar to bring tailscale0 up with an address.
              ip link show tailscale0 | grep -q "LOWER_UP" && \
              ip addr show tailscale0 | grep -q "inet" || exit 1
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60
        env:
        - name: TZ
          value: "America/Los_Angeles"
        - name: WEBUI_PORT
          value: "8080"
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        resources:
          limits:
            memory: "1Gi"
            cpu: "500m"
          requests:
            memory: "512Mi"
            cpu: "250m"
        ports:
        - containerPort: 8080
          name: webui
        volumeMounts:
        - name: config-volume
          mountPath: /config
        - name: data-nfs-volume
          mountPath: /data
      volumes:
      - name: config-volume
        persistentVolumeClaim:
          claimName: qbittorrent-config
      - name: data-nfs-volume
        persistentVolumeClaim:
          claimName: qbittorrent-data-nfs
      - name: tailscale-state
        persistentVolumeClaim:
          claimName: qbittorrent-tailscale-state
      - name: dev-net-tun
        hostPath:
          path: /dev/net/tun
          type: CharDevice
