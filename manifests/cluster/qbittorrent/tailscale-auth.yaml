apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tailscale-auth
  namespace: qbittorrent
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-notes
  target:
    name: tailscale-auth
    creationPolicy: Owner
  data:
  - secretKey: authkey
    remoteRef:
      # Vaultwarden item whose Notes contain a reusable, tagged Tailscale auth
      # key. Replace this UUID before merging.
      key: REPLACE_WITH_VAULTWARDEN_ITEM_ID
