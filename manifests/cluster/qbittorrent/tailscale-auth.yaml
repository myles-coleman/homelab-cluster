apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tailscale-auth
  namespace: qbittorrent
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-notes
  target:
    name: tailscale-auth
    creationPolicy: Owner
  data:
  - secretKey: authkey
    remoteRef:
      # Vaultwarden item whose Notes contain a reusable, tagged Tailscale auth
      # key. Replace this UUID before merging.
      key: 5b6cea36-2a29-4d7c-971d-c3e98f845c08
