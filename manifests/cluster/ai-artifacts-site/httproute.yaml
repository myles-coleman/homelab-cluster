apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: artifacts
  namespace: ai-artifacts-site
  annotations:
    gethomepage.dev/description: Published research and design notes
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Services
    gethomepage.dev/icon: obsidian.svg
    gethomepage.dev/name: AI Artifacts
    gethomepage.dev/pod-selector: "app=ai-artifacts-site"
    gethomepage.dev/weight: "70"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - artifacts.cowlab.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: ai-artifacts-site
          port: 80
          weight: 1
