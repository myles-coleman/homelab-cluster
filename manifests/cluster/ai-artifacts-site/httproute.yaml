apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: artifacts
  namespace: ai-artifacts-site
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - artifacts.cowlab.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: ai-artifacts-site
          port: 80
          weight: 1
