apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ai-artifacts-site
  namespace: ai-artifacts-site
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`artifacts.cowlab.org`)
      kind: Rule
      services:
        - name: ai-artifacts-site
          port: 80
