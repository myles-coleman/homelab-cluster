apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ai-artifacts-site-ghcr
  namespace: ai-artifacts-site
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: ai-artifacts-site-ghcr
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    # GitHub username + a GHCR read token stored as a Bitwarden login item.
    # Replace the placeholder item id with the real Vaultwarden item id.
    - secretKey: username
      remoteRef:
        key: BITWARDEN_GHCR_ITEM_ID
        property: username
    - secretKey: password
      remoteRef:
        key: BITWARDEN_GHCR_ITEM_ID
        property: password
