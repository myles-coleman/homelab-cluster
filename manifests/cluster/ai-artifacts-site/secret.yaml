apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ai-artifacts-site-ghcr
  namespace: ai-artifacts-site
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: ai-artifacts-site-ghcr
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    # GitHub username + a GHCR read token stored as a Vaultwarden login item.
    - secretKey: username
      remoteRef:
        key: 4a9d9524-b080-409a-8ec0-c2623f2c33c9
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: password
      remoteRef:
        key: 4a9d9524-b080-409a-8ec0-c2623f2c33c9
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
