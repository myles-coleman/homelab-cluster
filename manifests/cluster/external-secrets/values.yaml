installCRDs: true

certManager:
  enabled: false  # Disabled to avoid circular dependency with cert-manager
  addInjectorAnnotations: false
  cert:
    create: false
    issuerRef:
      group: cert-manager.io
      kind: "Issuer"
      name: "external-secrets-ca-issuer"


webhook:
  # Digest pin (spec 06 task 2.0): the webhook workload has its own image block.
  image:
    tag: v0.10.4@sha256:da1a2ea3f7e855b2fafed792740151edffd7935cfc34542ec6715da30e65ac92
  certManager:
    enabled: false  # Disabled to avoid circular dependency with cert-manager
    cert:
      create: false

      issuerRef:
        group: cert-manager.io
        kind: "Issuer"
        name: "external-secrets-ca-issuer"
      duration: "2160h"
      renewBefore: "720h"
  #(Related to a cert invalid webhook issue)
  lookaheadInterval: "210h"

# Digest pins (spec 06 task 2.0). The chart renders three workloads from the same
# image, each with its own image block, so all three are pinned explicitly.
image:
  tag: v0.10.4@sha256:da1a2ea3f7e855b2fafed792740151edffd7935cfc34542ec6715da30e65ac92
certController:
  image:
    tag: v0.10.4@sha256:da1a2ea3f7e855b2fafed792740151edffd7935cfc34542ec6715da30e65ac92
