apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyseerr
  namespace: jellyseerr
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - jellyseerr.cowlab.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # The shared forward-auth gate. Cross-namespace reference, permitted by
      # ReferenceGrant `allow-forward-auth` in the `traefik` namespace.
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: authentik
      backendRefs:
        - group: ""
          kind: Service
          name: jellyseerr
          port: 5055
          weight: 1
