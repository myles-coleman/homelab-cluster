apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seerr
  namespace: jellyseerr
  annotations:
    gethomepage.dev/description: Media Library Manager
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Downloaders
    gethomepage.dev/icon: seerr.svg
    gethomepage.dev/name: Seerr
    gethomepage.dev/pod-selector: "app=seerr"
    gethomepage.dev/weight: "10"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - seerr.cowlab.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # The shared forward-auth gate. Cross-namespace reference, permitted by
      # ReferenceGrant `allow-forward-auth` in the `traefik` namespace.
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: authentik
      backendRefs:
        - group: ""
          kind: Service
          name: seerr
          port: 5055
          weight: 1
