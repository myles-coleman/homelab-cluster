# Forward-auth gate for this namespace.
#
# This is a copy of `manifests/cluster/traefik/middleware-authentik.yaml`, and it
# must stay byte-identical apart from `metadata.namespace`.
#
# Why a copy: Traefik's Kubernetes Gateway API provider resolves an HTTPRoute's
# `ExtensionRef` filter **in the route's own namespace**. A cross-namespace
# Middleware reference is not supported — there is no `namespace` field on
# Gateway API's `ExtensionRef`, and Traefik builds the CRD reference as
# `<route-namespace>-<name>@kubernetescrd`. The failure is visible in the
# Traefik log as `middleware "jellyseerr-authentik@kubernetescrd" does not
# exist`, and it produces a 404 for every request rather than a login redirect.
# A ReferenceGrant cannot fix it: grants authorise cross-namespace *backends*,
# not this.
#
# trustForwardHeader is deliberately not set. It is deprecated in Traefik v3.7,
# and enabling it would let a client supply its own X-Forwarded-Host, which is
# how the outpost decides which application is being authorised.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik
  namespace: jellyseerr
spec:
  forwardAuth:
    address: http://authentik-outpost.authentik.svc.cluster.local:9000/outpost.goauthentik.io/auth/traefik
    authRequestHeaders:
      - Cookie
      - X-Forwarded-Method
      - X-Forwarded-Proto
      - X-Forwarded-Host
      - X-Forwarded-Uri
      - X-Forwarded-For
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
