# The GitHub App credential (spec 30, FR-13, FR-39, FR-40).
#
# Two Vaultwarden secure notes, both read through the `bitwarden-notes` store,
# whose `remoteRef.key` is the item UUID and whose value is the note body:
#
#   agent-broker-app-id  -> the App's numeric id, nothing else
#   agent-broker-app     -> the App private key PEM, nothing else
#
# The note body must be EXACTLY the value: no label, no blank line, no trailing
# newline. See the warning in agent-sandbox/external-secret.yaml for why.
#
# Nothing else in the cluster mounts this Secret (FR-39): it is the only write
# credential in the system, and it must never reach the validator, the sandbox, or
# a PR-triggered runner.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: github-app
  namespace: agent-publisher
  labels:
    app.kubernetes.io/part-of: agent-broker
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-notes
  target:
    name: github-app
    creationPolicy: Owner
  data:
    - secretKey: app-id
      remoteRef:
        # Vaultwarden item UUID: secure note whose body is the numeric App id.
        key: REPLACE-WITH-APP-ID-ITEM-UUID
    - secretKey: private-key.pem
      remoteRef:
        # Vaultwarden item UUID: secure note whose body is the PEM private key.
        key: REPLACE-WITH-APP-KEY-ITEM-UUID
