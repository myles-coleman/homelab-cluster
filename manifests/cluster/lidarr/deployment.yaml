apiVersion: apps/v1
kind: Deployment
metadata:
  name: lidarr
  namespace: lidarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lidarr
  # The volumes this Deployment mounts are Longhorn ReadWriteOnce, so a new pod
  # cannot attach them while the old pod still holds them. maxSurge 0 terminates
  # the old pod first; maxUnavailable 1 allows that. `type: Recreate` would say
  # the same thing but is rejected by the API, because the live Deployment keeps
  # its default rollingUpdate fields and both cannot be set at once.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: lidarr
    spec:
      containers:
      - name: lidarr
        image: lscr.io/linuxserver/lidarr:version-3.1.6.5079@sha256:8fb40ada166dd1880cb1b166df5bcbb081107523f20ab60df05c313e2052a467
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"
        env:
        - name: TZ
          value: "Etc/UTC"
        ports:
        - containerPort: 8686
        volumeMounts:
        - name: data-volume
          mountPath: /data
        - name: config-volume
          mountPath: /config
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: lidarr-data
      - name: config-volume
        persistentVolumeClaim:
          claimName: lidarr-config
