# A plain Sandbox with an inline podTemplate (spec 20, Unit 3). Deliberately NOT a
# SandboxTemplate/Claim/WarmPool: the extensions/Template path is the only path
# with controller-created NetworkPolicy reconciliation, and its `Managed` default
# allows public-internet egress. Because a plain Sandbox gets no secure defaults,
# automountServiceAccountToken and dnsPolicy are set by hand.
apiVersion: agents.x-k8s.io/v1beta1
kind: Sandbox
metadata:
  name: opencode
  namespace: agent-sandbox
spec:
  podTemplate:
    metadata:
      labels:
        app: opencode-sandbox
    spec:
      # ── ADOPTED: gVisor is ON (spec 22, 2026-11-03) ─────────────────────────
      # Spec 21's finding was real but version- and mount-dependent. Spec 22
      # re-ran the differential on gVisor 20261102.0 — a release that contains the
      # CVE-2026-96812 fix — with this pod's exact topology: four throwaway
      # Sandboxes (emptyDir and PVC workspaces, with and without the config
      # ConfigMap) all ran 35 minutes with zero restarts, including the
      # production-equivalent row. This pod then soaked on the live workspace.
      # Evidence and the decision record live in the artifacts vault under
      # nixos/docs/specs/22-spec-gvisor-sandbox-runtime/.
      # Reverting is commenting this line out and deleting the pod.
      runtimeClassName: gvisor
      automountServiceAccountToken: false
      # No DNS: name resolution is its own exfiltration channel, and the sandbox
      # needs none (the proxy and the model are reached by IP literal).
      dnsPolicy: None
      dnsConfig:
        # Kubernetes rejects `dnsPolicy: None` with an empty nameserver list
        # ("must provide at least one DNS nameserver"), so point at the pod's own
        # loopback, where no resolver listens: names never resolve. Port 53 is
        # also absent from the egress NetworkPolicy, so this is belt-and-braces.
        nameservers:
          - 127.0.0.1
        searches: []
      nodeSelector:
        sandbox.node/runtime: gvisor
      tolerations:
        - key: sandbox
          operator: Equal
          value: gvisor
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # Pod Security Admission `restricted` requires an explicit seccomp profile.
        # RuntimeDefault is an errno-returning profile, not a trapping one, so it
        # does not hit Bun's SECCOMP_RET_TRAP handler bug.
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opencode
          # Digest-pinned; built by the nixos `build-images.yaml` workflow.
          image: ghcr.io/myles-coleman/opencode-sandbox@sha256:557db5201c0c389fbe34a57d571cdc8d50c389d7b8fe208d9c2c1f0a8c53df1a
          imagePullPolicy: IfNotPresent
          # Enforced (verified in-pod, not merely declared): no privilege gain, no
          # capabilities, and an immutable root filesystem. Writable state lives on
          # the PVC at /home/agent and in the /tmp emptyDir below.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          command: ["opencode"]
          args: ["serve", "--hostname", "0.0.0.0", "--port", "4096"]
          ports:
            # `protocol` is required: the Sandbox CRD's schema makes this a keyed
            # list, and omitting it makes ArgoCD fail to calculate a diff
            # ("associative list with keys has an element that omits key field
            # protocol"), which silently blocks the whole Application.
            - name: http
              containerPort: 4096
              protocol: TCP
          env:
            - name: HOME
              value: /home/agent
            - name: OPENCODE_SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opencode-sandbox-secrets
                  key: opencode-server-password
            # The model's API key: OpenCode's config references it as
            # {env:STRATA_API_KEY}, so it never lands in the ConfigMap.
            - name: STRATA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: opencode-sandbox-secrets
                  key: strata-api-key
            # No git credential here (spec 21, Unit 1). The sandbox used to carry a
            # fine-grained PAT with Contents: write, which is also the merge
            # permission — and a merge runs `deploy.yaml` as a user with passwordless
            # sudo on `homelab` and `bee-gpu-server`. The token is revoked; the agent
            # clones the public repo read-only and hands work back as patch files
            # via `git format-patch`. Do not re-add a write credential.
            # No DNS, so the proxy and the model are addressed by IP literal.
            # NOTE (deviation): the spec's Unit 4 named the Strata Service DNS
            # name; with dnsPolicy None that cannot resolve, so the tailnet IP is
            # used instead.
            - name: HTTP_PROXY
              value: http://10.43.0.250:3128
            - name: HTTPS_PROXY
              value: http://10.43.0.250:3128
            # The k8s-infra agent's Service ClusterIP. Deliberately NOT the
            # node's own 10.0.0.146:4318 hostPort: from a pod on that same node
            # the hostPort is DNAT'd to the agent pod and the reply bypasses
            # conntrack, so the handshake never completes (measured 0/10, while
            # a pod on another node succeeded 10/10). The ClusterIP path is
            # masqueraded by kube-proxy and works from any node. The ClusterIP is
            # cluster-assigned; re-read it with
            #   kubectl get svc -n signoz-k8s-infra k8s-infra-otel-agent
            # and update this value and NO_PROXY if the Service is recreated.
            - name: NO_PROXY
              value: 10.43.0.250,100.127.170.8,10.43.78.178,localhost,127.0.0.1
            # Observability (spec 02, Unit 1). Only OTEL_EXPORTER_OTLP_ENDPOINT is
            # read: it gates BOTH the trace and the log exporter, while per-signal
            # endpoint vars, protocol vars and OTEL_TRACES_EXPORTER are ignored.
            # Do NOT add OTEL_SERVICE_NAME: `service.name` is hardcoded to
            # `opencode` in the binary and the variable has no effect. The
            # discriminator is `deployment.environment`, because service.name
            # would silently merge a future desktop or CI instance into this one.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://10.43.78.178:4318
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment=agent-sandbox,service.namespace=agent-sandbox
            - name: OPENCODE_DISABLE_MODELS_FETCH
              value: "1"
            - name: OPENCODE_DISABLE_LSP_DOWNLOAD
              value: "1"
            - name: OPENCODE_DISABLE_AUTOUPDATE
              value: "1"
            # A git identity is required for the agent to commit locally and run
            # `git format-patch` (spec 21, Unit 2). It is set here rather than
            # baked into the image so no image rebuild and digest repin is needed
            # for a two-line change; git falls back to these for the author fields
            # too. The address is deliberately unroutable.
            - name: GIT_COMMITTER_NAME
              value: OpenCode Sandbox Agent
            - name: GIT_COMMITTER_EMAIL
              value: agent@sandbox.invalid
          volumeMounts:
            - name: workspace
              mountPath: /home/agent
            # Shadows only ~/.config/opencode; the PVC stays intact underneath.
            - name: opencode-config
              mountPath: /home/agent/.config/opencode
            # The root filesystem is read-only, so anything that needs a writable
            # scratch path uses this bounded emptyDir.
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: opencode-workspace
        - name: opencode-config
          configMap:
            name: opencode-sandbox-config
        - name: tmp
          emptyDir:
            # Bounded so a runaway agent cannot fill the node's disk.
            sizeLimit: 1Gi
