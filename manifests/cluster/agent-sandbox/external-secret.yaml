# Cluster secrets come from ESO (spec 20, Unit 4). The Strata API key, the
# OpenCode server password, the scoped git PAT, and the GHCR pull credential are
# synced from the existing bitwarden-login ClusterSecretStore.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: opencode-sandbox-secrets
  namespace: agent-sandbox
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: opencode-sandbox-secrets
    creationPolicy: Owner
  data:
    - secretKey: strata-api-key
      remoteRef:
        key: strata-api-key
    - secretKey: opencode-server-password
      remoteRef:
        key: opencode-sandbox-server-password
    - secretKey: git-pat
      remoteRef:
        key: opencode-sandbox-git-pat
    - secretKey: ghcr-pull-token
      remoteRef:
        key: ghcr-pull-token
