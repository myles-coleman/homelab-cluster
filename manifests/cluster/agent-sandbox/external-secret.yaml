# Cluster secrets come from ESO (spec 20, Unit 4).
#
# The `bitwarden-login` ClusterSecretStore resolves
#   http://bitwarden-cli:8087/object/item/{{ .remoteRef.key }}  →  $.data.login.{{ .remoteRef.property }}
# so `remoteRef.key` must be the Vaultwarden item UUID and `property` names the
# field. Each secret below is a Vaultwarden *login* item with the value in its
# `password` field.
#
# There is deliberately NO GHCR pull credential: the strata-rocm package is public,
# so both the host and the sandbox pull it anonymously.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: opencode-sandbox-secrets
  namespace: agent-sandbox
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: opencode-sandbox-secrets
    creationPolicy: Owner
  data:
    # Must equal `strata_api_key` in secrets/hosts/bee-gpu-server.yaml — it is the
    # same --api-key Strata serves with.
    - secretKey: strata-api-key
      remoteRef:
        key: d7fae6eb-9ce4-46f5-a0bf-3585692fe49d
        property: password
    # The sandbox's own HTTP Basic password (username `opencode`), chosen by the
    # operator — the second factor behind the tailnet.
    - secretKey: opencode-server-password
      remoteRef:
        key: REPLACE_WITH_OPENCODE_SERVER_PASSWORD_ITEM_UUID
        property: password
    # Fine-grained PAT: Contents read/write + Metadata read on the pilot repo only.
    - secretKey: git-pat
      remoteRef:
        key: d96d0d7f-b7b9-445f-b530-32b004c87aa0
        property: password
