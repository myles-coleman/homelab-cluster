# Cluster secrets come from ESO (spec 20, Unit 4).
#
# The `bitwarden-notes` ClusterSecretStore resolves
#   http://bitwarden-cli:8087/object/item/{{ .remoteRef.key }}  →  $.data.notes
# so `remoteRef.key` is the Vaultwarden item UUID and the item's *note body* is the
# secret. These items are secure notes, not logins — the `bitwarden-login` store
# reads `$.data.login.<property>`, which a note does not have, and returns
# "endpoint gave error 400 Bad Request".
#
# ⚠️ The note body must be EXACTLY the secret — no label, no blank line, no trailing
# newline. Anything extra becomes part of the value and shows up as an auth failure
# that looks like something else. Verify with the md5 check in the runbook.
#
# There is deliberately NO GHCR pull credential: the strata-rocm package is public,
# so both the host and the sandbox pull it anonymously.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: opencode-sandbox-secrets
  namespace: agent-sandbox
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-notes
  target:
    name: opencode-sandbox-secrets
    creationPolicy: Owner
  data:
    # Must equal `strata_api_key` in secrets/hosts/bee-gpu-server.yaml — it is the
    # same --api-key Strata serves with.
    - secretKey: strata-api-key
      remoteRef:
        key: d7fae6eb-9ce4-46f5-a0bf-3585692fe49d
    # The sandbox's own HTTP Basic password (username `opencode`), chosen by the
    # operator — the second factor behind the tailnet.
    - secretKey: opencode-server-password
      remoteRef:
        key: eb0b4bb6-c5d0-4815-ab0b-d2afe6df6444
    # Fine-grained PAT: Contents read/write + Metadata read on the pilot repo only.
    - secretKey: git-pat
      remoteRef:
        key: d96d0d7f-b7b9-445f-b530-32b004c87aa0
