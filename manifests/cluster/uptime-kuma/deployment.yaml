apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  namespace: uptime-kuma
spec:
  # Single replica on purpose. The database is SQLite on a Longhorn
  # ReadWriteOnce volume; a second replica cannot attach it, and Uptime Kuma has
  # no leader election, so two pods would corrupt the monitor history rather than
  # share it.
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: uptime-kuma
  # maxSurge 0 / maxUnavailable 1 for the same reason searxng does it: the volume
  # is ReadWriteOnce, so the replacement pod cannot attach while the old one still
  # holds it. `type: Recreate` says the same thing but is rejected by the API while
  # the live Deployment keeps its default rollingUpdate fields.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: uptime-kuma
    spec:
      securityContext:
        # The upstream image expects to run as root and drops privileges itself
        # for its embedded server; fsGroup keeps the Longhorn volume writable
        # across pod restarts instead of leaving root-owned SQLite files behind.
        fsGroup: 1000
      containers:
        - name: uptime-kuma
          # Arm64-capable multi-arch index, so it schedules on the Pi 5 nodes.
          image: "louislam/uptime-kuma:2@sha256:8e4b6bef96417ec98a35dc103c99cc64fc229a01e584e56d95d9004d2003c02a"
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: America/Los_Angeles
            # The image reports anonymous install telemetry to the maintainers.
            # This is a private instance; opt out.
            - name: UPTIME_KUMA_DISABLE_STATS
              value: "true"
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /app/data
          # First boot creates the SQLite schema, so the initial delay covers that
          # rather than the steady-state start. A 3xx counts as success for an
          # httpGet probe, which matters because `/` redirects to the dashboard.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: uptime-kuma-data
