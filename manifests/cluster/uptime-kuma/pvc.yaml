# Uptime Kuma keeps its monitors, history and status pages in a SQLite database
# under /app/data. 1Gi is generous for a year of heartbeats at the intervals here;
# raising it later is a resize, not a rebuild.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uptime-kuma-data
  namespace: uptime-kuma
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
