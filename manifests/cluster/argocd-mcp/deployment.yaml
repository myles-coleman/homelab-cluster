apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-mcp
  namespace: argocd-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argocd-mcp
  template:
    metadata:
      labels:
        app: argocd-mcp
    spec:
      containers:
      - name: argocd-mcp
        # Pinned: this image used to listen on 0.0.0.0, but upstream tightened the
        # default to 127.0.0.1 (security.ts resolveListenerSecurity) and refuses a
        # wider bind without an inbound credential. Left on `:latest`, a restart
        # silently produced a loopback-only listener that the TCP probes could
        # never reach. See MCP_BIND_ADDRESS / args below.
        image: ghcr.io/argoproj-labs/mcp-for-argocd:v0.9.0
        imagePullPolicy: IfNotPresent
        # The image entrypoint is `node dist/index.js`; args replace its `http` CMD.
        # --allow-unauthenticated is the documented opt-out for a listener that is
        # already fenced off by a NetworkPolicy: only the traefik and open-webui
        # namespaces can reach port 3000, and MCP_READ_ONLY=true keeps the tool
        # surface read-only.
        args:
        - http
        - --allow-unauthenticated
        env:
        - name: TZ
          value: "Etc/UTC"
        # Widening past loopback makes the port reachable by the Service and the
        # argocd-mcp.cowlab.org IngressRoute.
        - name: MCP_BIND_ADDRESS
          value: "0.0.0.0"
        - name: ARGOCD_BASE_URL
          value: "http://argocd-server.argocd.svc.cluster.local"
        - name: ARGOCD_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: argocd-mcp-credentials
              key: api-token
        - name: MCP_READ_ONLY
          value: "true"
        - name: NODE_TLS_REJECT_UNAUTHORIZED
          value: "0"
        ports:
        - containerPort: 3000
        resources:
          limits:
            memory: "256Mi"
            cpu: "500m"
          requests:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 30
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
      volumes:
      - name: tmp
        emptyDir: {}
