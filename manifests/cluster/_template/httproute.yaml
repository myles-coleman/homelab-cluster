apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: CHANGEME
  namespace: CHANGEME
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - CHANGEME.cowlab.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: CHANGEME
          port: CHANGEME
          weight: 1
