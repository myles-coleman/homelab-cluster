apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: CHANGEME
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml

# Data-bearing objects cannot be pruned. See _prune-protection/.
components:
  - ../_prune-protection
  # Baseline network posture: default-deny, in-namespace + Traefik + SigNoz
  # ingress, all egress including DNS. See _netpols/README.md.
  - ../_netpols/_baseline
