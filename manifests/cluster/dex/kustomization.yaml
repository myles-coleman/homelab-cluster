apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dex
resources:
  - helm-chart.yaml
  - httproute.yaml
  - namespace.yaml

components:
  - secrets/github
  - secrets/argocd

secretGenerator:
- name: dex-config
  files:
    - config.yaml
  options:
    disableNameSuffixHash: true

# Data-bearing objects cannot be pruned. See _prune-protection/.
components:
  - ../_prune-protection
