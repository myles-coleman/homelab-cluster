apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dex
  namespace: dex
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - dex.cowlab.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /dex
      backendRefs:
        - group: ""
          kind: Service
          name: dex
          port: 5556
          weight: 1
