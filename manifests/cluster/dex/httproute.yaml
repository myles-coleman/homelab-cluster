apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dex
  namespace: dex
  annotations:
    gethomepage.dev/description: OIDC connector for Argo CD
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: System
    gethomepage.dev/icon: mdi-shield-key
    gethomepage.dev/name: Dex
    gethomepage.dev/weight: "60"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - dex.cowlab.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /dex
      backendRefs:
        - group: ""
          kind: Service
          name: dex
          port: 5556
          weight: 1
