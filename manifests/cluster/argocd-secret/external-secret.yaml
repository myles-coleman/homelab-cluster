# ArgoCD's runtime Secret lives outside Git: the Helm chart in homelab-terraform
# deliberately does not render it (configs.secret.createSecret: false), because
# chart 10.x emits no server.secretkey and every Helm release replace wiped the
# key ArgoCD generates at startup. ESO is the single writer of these keys; keep
# `creationPolicy: Merge` so anything ArgoCD writes itself (admin.password,
# account tokens) survives a resync.
#
# `helm.sh/resource-policy: keep` matters as much as the data: helm deletes
# resources that disappear from a release manifest on upgrade, and the upgrade
# that sets createSecret: false removes this Secret from that manifest. The
# annotation is read from the live object, so with it Helm skips the delete and
# the Secret outlives the release entry.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-secret
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-notes
  target:
    name: argocd-secret
    creationPolicy: Merge
    template:
      engineVersion: v2
      metadata:
        annotations:
          helm.sh/resource-policy: keep
      data:
        oidc.sso.clientSecret: '{{ .ARGOCD_CLIENT_SECRET | replace "\n" "" | replace "\r" "" }}'
        server.secretkey: '{{ .ARGOCD_SERVER_SECRETKEY | replace "\n" "" | replace "\r" "" }}'
  data:
  - secretKey: ARGOCD_CLIENT_SECRET
    remoteRef:
      key: ccbcba88-dcfb-4ec4-8223-453dd5491d67
  - secretKey: ARGOCD_SERVER_SECRETKEY
    remoteRef:
      key: 3e15f1f7-3960-4fe9-b9e4-9031f3823e86
