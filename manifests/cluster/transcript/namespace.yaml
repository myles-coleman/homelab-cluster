apiVersion: v1
kind: Namespace
metadata:
  name: transcript
  labels:
    # privileged, not baseline: the proxy is hostNetwork (see deployment.yaml),
    # which baseline forbids. This mirrors sandbox-telemetry, the other
    # hostNetwork workload in the cluster. warn/audit stay at restricted so a
    # future deviation is still reported.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
  annotations:
    # A pruned Namespace would take the transcripts' only route with it, and
    # ArgoCD pruning a namespace is never what a manifest edit means.
    argocd.argoproj.io/sync-options: Prune=false
