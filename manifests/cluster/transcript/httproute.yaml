apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: transcript
  namespace: transcript
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - transcript.cowlab.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: authentik
      backendRefs:
        - group: ""
          kind: Service
          name: transcript-proxy
          port: 8080
          weight: 1
