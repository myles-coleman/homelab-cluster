# Forward-auth gate for this namespace.
#
# A copy of `manifests/cluster/traefik/middleware-authentik.yaml`; the spec is
# byte-identical, only `metadata.namespace` differs. Traefik's Gateway API
# provider resolves an HTTPRoute's `ExtensionRef` in the route's own namespace
# as `<route-namespace>-<name>@kubernetescrd`, so a cross-namespace Middleware
# is not possible and a ReferenceGrant does not help (grants authorise
# backends).
#
# trustForwardHeader is deliberately not set: deprecated in Traefik v3.7, and
# enabling it would let a client supply its own X-Forwarded-Host, which is how
# the outpost decides which application is being authorised.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik
  namespace: transcript
spec:
  forwardAuth:
    address: http://authentik-outpost.authentik.svc.cluster.local:9000/outpost.goauthentik.io/auth/traefik
    authRequestHeaders:
      - Cookie
      - X-Forwarded-Method
      - X-Forwarded-Proto
      - X-Forwarded-Host
      - X-Forwarded-Uri
      - X-Forwarded-For
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
