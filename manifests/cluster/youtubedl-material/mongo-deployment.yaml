apiVersion: apps/v1
kind: Deployment
metadata:
  name: ytdl-mongo-db
  namespace: youtubedl-material
spec:
  replicas: 1
  selector:
  # The volumes this Deployment mounts are Longhorn ReadWriteOnce, so a new pod
  # cannot attach them while the old pod still holds them. maxSurge 0 terminates
  # the old pod first; maxUnavailable 1 allows that. `type: Recreate` would say
  # the same thing but is rejected by the API, because the live Deployment keeps
  # its default rollingUpdate fields and both cannot be set at once.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

    matchLabels:
      app: ytdl-mongo-db
  template:
    metadata:
      labels:
        app: ytdl-mongo-db
    spec:
      containers:
      - name: mongo
        image: mongo:4@sha256:52c42cbab240b3c5b1748582cc13ef46d521ddacae002bbbda645cebed270ec0
        resources:
          limits:
            memory: "1024Mi"
            cpu: "500m"
          requests:
            memory: "512Mi"
            cpu: "250m"
        ports:
        - containerPort: 27017
        volumeMounts:
        - name: mongo-data
          mountPath: /data/db
      volumes:
      - name: mongo-data
        persistentVolumeClaim:
          claimName: ytdl-mongo-data
