apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ytdl
  namespace: youtubedl-material
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - ytdl.cowlab.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: youtubedl-material
          port: 17442
          weight: 1
