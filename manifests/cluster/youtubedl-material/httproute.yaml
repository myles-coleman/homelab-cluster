apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ytdl
  namespace: youtubedl-material
  annotations:
    gethomepage.dev/description: YouTube Downloader
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Services
    gethomepage.dev/icon: youtube.svg
    gethomepage.dev/name: ytdl-material
    gethomepage.dev/pod-selector: "app=youtubedl-material"
    gethomepage.dev/weight: "50"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - ytdl.cowlab.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: youtubedl-material
          port: 17442
          weight: 1
