apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: copyparty
  namespace: copyparty
  annotations:
    gethomepage.dev/description: File Sharing and Management
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Services
    gethomepage.dev/icon: copyparty.svg
    gethomepage.dev/name: Copyparty
    gethomepage.dev/pod-selector: "app=copyparty"
    gethomepage.dev/weight: "20"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - copyparty.cowlab.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        # Gate first, then mark the request for Copyparty's identity headers.
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: authentik
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: idp-key
      backendRefs:
        - group: ""
          kind: Service
          name: copyparty
          port: 3923
          weight: 1
