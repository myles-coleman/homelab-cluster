# The Authentik login callback for this host.
#
# Must NOT carry either filter: it is the endpoint that performs the
# authentication. The cross-namespace backend is permitted by ReferenceGrant
# `allow-outpost-routes` in the `authentik` namespace.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: copyparty-outpost
  namespace: copyparty
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - copyparty.cowlab.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /outpost.goauthentik.io
      backendRefs:
        - group: ""
          kind: Service
          name: authentik-outpost
          namespace: authentik
          port: 9000
          weight: 1
