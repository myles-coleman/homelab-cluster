# Forward-auth gate for this namespace.
#
# Copy of `manifests/cluster/traefik/middleware-authentik.yaml`; it must stay
# identical apart from `metadata.namespace`, because Traefik resolves an
# HTTPRoute's `ExtensionRef` in the route's own namespace.
#
# Copyparty also consumes what this forwards: `--idp-h-usr` and `--idp-h-grp`
# read `X-Authentik-Username` / `X-Authentik-Groups`, so the volume ACLs apply to
# the authenticated user instead of an anonymous visitor.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik
  namespace: copyparty
spec:
  forwardAuth:
    address: http://authentik-outpost.authentik.svc.cluster.local:9000/outpost.goauthentik.io/auth/traefik
    authRequestHeaders:
      - Cookie
      - X-Forwarded-Method
      - X-Forwarded-Proto
      - X-Forwarded-Host
      - X-Forwarded-Uri
      - X-Forwarded-For
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
