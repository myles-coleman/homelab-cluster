# The whole Copyparty configuration, rendered from Vaultwarden.
#
# It lives here rather than in a ConfigMap because the admin password is part of
# the configuration file: Copyparty has no environment-variable interpolation, so
# the only way to keep the credential out of Git is to template the file itself.
#
# Identity is taken from the forward-auth headers rather than an anonymous
# account:
#   --idp-h-usr  the Authentik username becomes the Copyparty user
#   --idp-h-grp  the Authentik groups decide which volume ACL applies
#   --idp-h-key  a marker header that only the proxy sets; without it the
#                identity headers are ignored even if a request reaches the pod
#
# `--xff-src` is the pod network because Traefik, not Cloudflare, is the direct
# peer. Verified against the access log after the change; see spec 05 Unit 3.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: copyparty-config
  namespace: copyparty
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-notes
  target:
    name: copyparty-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        copyparty.conf: |
          [global]
            p: 3923
            e2dsa
            e2ts
            hist: /cfg/hists/
            idp-h-usr: X-Authentik-Username
            idp-h-grp: X-Authentik-Groups
            idp-h-key: X-Idp-Key
            idp-gsep: ,
            xff-hdr: cf-connecting-ip
            xff-src: 10.42.0.0/16
            u2sz: 1,64,96

          [accounts]
            admin: {{ .COPYPARTY_ADMIN_PASSWORD }}

          [/]
            /w
            accs:
              r: @homelab
              rw: @homelab
            flags:
              maxb=4g

          [/media]
            /w/media
            accs:
              r: admin
              rw: admin
            flags:
              maxb=4g

          [/uploads]
            /w/uploads
            accs:
              w: @homelab
              rw: @homelab
            flags:
              e2d
              nodupe
              maxb=4g
  data:
    - secretKey: COPYPARTY_ADMIN_PASSWORD
      remoteRef:
        key: 3bdd99ed-868b-467d-8287-a2a176c7b231
