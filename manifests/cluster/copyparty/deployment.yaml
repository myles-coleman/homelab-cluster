apiVersion: apps/v1
kind: Deployment
metadata:
  name: copyparty
  namespace: copyparty
  labels:
    app: copyparty
spec:
  replicas: 1
  selector:
    matchLabels:
      app: copyparty
  # The volumes this Deployment mounts are Longhorn ReadWriteOnce, so a new pod
  # cannot attach them while the old pod still holds them. maxSurge 0 terminates
  # the old pod first; maxUnavailable 1 allows that. `type: Recreate` would say
  # the same thing but is rejected by the API, because the live Deployment keeps
  # its default rollingUpdate fields and both cannot be set at once.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: copyparty
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: copyparty
        image: copyparty/ac:1.18.6@sha256:6a925c50732959921262eb795eabfba2a6b3bf705c7a7115f01edf72a201d065
        ports:
        - containerPort: 3923
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        volumeMounts:
        - name: config-volume
          mountPath: /cfg/copyparty.conf
          subPath: copyparty.conf
        - name: ui-volume
          mountPath: /cfg/ui
          readOnly: true
        - name: data-volume
          mountPath: /w
        - name: media-volume
          mountPath: /w/media
          subPath: data/media
        - name: persistent-config
          mountPath: /cfg/hists
        livenessProbe:
          httpGet:
            path: /
            port: 3923
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3923
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: config-volume
        configMap:
          # No credential lives in this file; see the ConfigMap's comment.
          name: copyparty-config
      - name: ui-volume
        configMap:
          # Stylesheet exposed at /theme/theme.css; see ui-configmap.yaml.
          name: copyparty-ui
      - name: data-volume
        persistentVolumeClaim:
          claimName: copyparty-data
      - name: media-volume
        persistentVolumeClaim:
          claimName: copyparty-media
      - name: persistent-config
        persistentVolumeClaim:
          # Replaces the wedged `copyparty-config` volume; see the PVC's comment.
          claimName: copyparty-hists
