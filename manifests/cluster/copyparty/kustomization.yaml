apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - configmap.yaml
  - ui-configmap.yaml
  - persistent-volume-claim-longhorn.yaml
  - persistent-volume-nfs.yaml
  - persistent-volume-claim-nfs.yaml
  - deployment.yaml
  - service.yaml
  - middleware-authentik.yaml
  - middleware-idp-key.yaml
  - middleware-auth-error-page.yaml
  - httproute.yaml
  - httproute-outpost.yaml
  - networkpolicy.yaml

# Data-bearing objects cannot be pruned. See _prune-protection/.
components:
  - ../_prune-protection
