apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: copyparty-data
  namespace: copyparty
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: longhorn
---
# Upload history and resume state for /cfg/hists.
#
# This replaced a 1 GiB claim (`copyparty-config`) whose Longhorn volume wedged in
# `creating`/`attaching` and would not start an engine for 379 days. That volume
# held nothing but this history, so the old claim was left in place rather than
# deleted: `Prune=false` (from ../_prune-protection) stops ArgoCD removing it, and
# nothing here claimed the data was worth keeping.
#
# It was deleted by hand once this replacement had been serving uploads for a few
# hours. Leaving it was not free: ArgoCD tracks what it has applied, so the orphan
# showed as an extraneous OutOfSync resource on the copyparty Application for as
# long as it existed. A future replacement of this claim should plan for that
# deletion rather than inheriting it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: copyparty-hists
  namespace: copyparty
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: longhorn
