image:
  repository: otel/opentelemetry-collector
  tag: 0.172.0

mode: deployment

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  exporters:
    logging:
      verbosity: normal
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: []
        exporters: [logging]
      metrics:
        receivers: [otlp]
        processors: []
        exporters: [logging]
      logs:
        receivers: [otlp]
        processors: []
        exporters: [logging]
