apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cloudflared

resources:
  - namespace.yaml
  - helmchart.yaml
  - external-secret.yaml

patches:
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: cloudflare-tunnel-cloudflare-tunnel-remote

# Data-bearing objects cannot be pruned. See _prune-protection/.
components:
  - ../_prune-protection
  # Baseline network posture: default-deny, in-namespace + Traefik + SigNoz
  # ingress, all egress including DNS. See _netpols/README.md.
  - ../_netpols/_baseline
