# Cloudflare Tunnel Remote configuration
# See: https://github.com/cloudflare/helm-charts/tree/main/charts/cloudflare-tunnel-remote

cloudflare:
  # Leave empty - token is provided via ExternalSecret
  tunnel_token: ""

# Replica count for high availability
replicaCount: 1

# Resource limits
resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

# Digest pin (spec 06 task 2.0). Tag is `latest` today; task 3.0 replaces it with
# a concrete version tag and keeps this digest.
image:
  repository: cloudflare/cloudflared
  tag: 2026.11.1@sha256:e613aadbc2d9511785d2e67a86b0c8ac18dd63a3f9af0d06faf04cbfdcb35f2d
