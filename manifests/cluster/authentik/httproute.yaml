# The identity provider's own host.
#
# Unlike the application hosts, this route keeps BOTH names on the listener:
# Authentik answers on whatever Host it is asked for, so both serve the login
# page, and the old one is what Google Cloud still has registered as the OAuth
# redirect URI. That registration is the one thing here this repository cannot
# change, so the old hostname stays until it has been updated in the Google
# console; removing it is a follow-up commit, not part of the rename.
#
# This is also the one host that must accept unauthenticated traffic: it is where
# users log in. It therefore carries no forward-auth middleware — the IdP cannot
# sit behind itself.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik
  namespace: authentik
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - auth.cowlab.org
    - authentik.cowlab.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: authentik-server
          port: 80
          weight: 1
