# The identity provider's own host.
#
# This is the one host that must accept unauthenticated traffic: it is where users
# log in. It therefore carries no forward-auth middleware — the IdP cannot sit
# behind itself.
#
# `authentik.cowlab.org` was served alongside this during the rename, because the
# old name was still registered as the Google OAuth redirect URI — a value this
# repository cannot change. That registration has been removed and the name is
# retired. Note what retiring it does and does not do: the tunnel CNAME in
# homelab-terraform is gone, but `*.cowlab.org` is a wildcard, so the name still
# resolves inside the LAN to Traefik and now answers 404.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik
  namespace: authentik
  annotations:
    gethomepage.dev/description: Identity provider and forward-auth
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: System
    gethomepage.dev/icon: authentik.svg
    gethomepage.dev/name: Authentik
    gethomepage.dev/weight: "50"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - auth.cowlab.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: authentik-server
          port: 80
          weight: 1
