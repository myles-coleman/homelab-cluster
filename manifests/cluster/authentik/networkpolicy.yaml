# Authentik is the one workload that must accept unauthenticated traffic from
# the internet, so it gets an explicit ingress policy rather than the cluster's
# default of unrestricted.
#
# Ingress only: the server needs broad egress to reach Google's OAuth endpoints
# for social login, and egress restriction is a separate change with its own
# failure modes.
#
# NetworkPolicy is additive, so a permissive policy anywhere in the namespace
# reopens the port. The chart renders one for PostgreSQL that sets
# allowExternal: true, admitting 5432 from every source; it is disabled in
# values.yaml so these rules are the only ones.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: authentik
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Internal traffic: the outpost reaches the server API, and the server and worker
# reach PostgreSQL. Scoped to the namespace so nothing outside it can pivot in.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: authentik
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
---
# The server's web port, reachable from Traefik: the login UI and, once
# applications are wired to it, the forward-auth calls.
#
# This is a separate policy from the outpost one on purpose. A podSelector with
# two matchExpressions is an AND, so a single selector naming both labels would
# match nothing and silently deny everything.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-server
  namespace: authentik
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: authentik
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 9000
---
# The proxy outpost's forward-auth endpoint.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-outpost
  namespace: authentik
spec:
  podSelector:
    matchLabels:
      app: authentik-outpost
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 9000
