repositories:
- name: authentik
  url: https://charts.goauthentik.io

releases:
- name: authentik
  namespace: authentik
  chart: authentik/authentik
  # Pinned: `helmfile template` with no version pulls the newest chart, which
  # moves PostgreSQL 17 -> 18 and authentik 2025.10 -> 2026.8 in one step. That
  # is a database migration, not a values change, and must be a deliberate
  # upgrade with a backup, not a side effect of regenerating this file.
  version: 2025.10.2
  values:
  - values.yaml