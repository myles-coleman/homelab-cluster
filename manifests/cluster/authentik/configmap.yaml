# A Kubernetes ConfigMap whose data is read by Authentik.
#
# "Blueprint" is Authentik's own name for this YAML format (version/metadata/
# entries) — it is not a Kubernetes concept. This object is just a ConfigMap; the
# only place the word survives is inside the file content and the directory
# Authentik scans (/blueprints).
#
# It is kept out of Terraform because the Google OAuth client secret is a
# resource attribute: Terraform would record it in terraform.tfstate. Here it is
# read from the pod environment via !Env, and the environment comes from the
# ESO-managed Secret.
#
# The chart can mount such a ConfigMap itself (values `blueprints.configMaps`),
# but that renders a copy container into the worker pod. Discovery walks the whole
# tree (tasks.py: rglob("**/*.yaml")), so a plain ConfigMap volume mounted under it
# is enough and needs no chart change.
#
# Only keys ending in .yaml are discovered.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-config
  namespace: authentik
data:
  google-source.yaml: |
    version: 1
    metadata:
      name: Homelab - Google source
    entries:
      # The login-page button. slug must stay "google": the redirect URI
      # registered in Google Cloud is
      # https://authentik.cowlab.org/source/oauth/callback/google/
      - id: google-source
        model: authentik_sources_oauth.oauthsource
        identifiers:
          slug: google
        attrs:
          name: Google
          provider_type: google
          consumer_key: !Env [GOOGLE_OAUTH_CLIENT_ID, null]
          consumer_secret: !Env [GOOGLE_OAUTH_CLIENT_SECRET, null]
          enabled: true
          # Both flows are required in practice, though the provider and the API
          # mark them optional. Without enrollment_flow a first-time Google user
          # cannot be created and the login errors with
          # "Source is not configured for enrollment"; without
          # authentication_flow an existing user cannot authenticate.
          authentication_flow: !Find [authentik_flows.flow, [slug, default-source-authentication]]
          enrollment_flow: !Find [authentik_flows.flow, [slug, default-source-enrollment]]

      # Creating the source is not enough: it appears on the login page only when
      # the identification stage lists it. The stage is a built-in object, so it
      # is identified by name and updated in place.
      #
      # user_fields is empty on purpose: the login form is rendered from
      # user_fields (plus password_fields, which is false here because the stage
      # has no password_stage), so an empty list leaves Google as the only way in.
      # The trade-off is that akadmin can no longer sign in through the UI either;
      # break-glass is `ak shell`, or restore a field here and re-apply.
      #
      # The remaining attributes are restated rather than only sources — the
      # default blueprint also configures this stage, and relying on a partial
      # merge would leave two writers disagreeing about the same object.
      - id: default-authentication-identification
        model: authentik_stages_identification.identificationstage
        identifiers:
          name: default-authentication-identification
        attrs:
          user_fields: []
          pretend_user_exists: true
          show_matched_user: true
          enable_remember_me: false
          case_insensitive_matching: true
          sources:
            - !KeyOf google-source

      # Users created by a source are "external" by default, and Authentik
      # restricts its own user interface to internal users — so a freshly
      # enrolled Google user authenticates fine and is then refused at /if/user/
      # with "Interface can only be accessed by internal users".
      #
      # Setting the type at the write stage fixes every future enrollment, which
      # a per-user edit cannot. The stage is identified by name and the bundled
      # blueprint sets only user_creation_mode, so this attribute is ours.
      #
      # Deliberately NOT set: create_users_group. The Google source accepts any
      # Google account, so auto-adding every enrollee to homelab would grant
      # anyone with a Gmail address access to every application bound to it.
      # App access is therefore opt-in: membership of homelab is the allowlist,
      # and it is assigned per user.
      - id: default-source-enrollment-write
        model: authentik_stages_user_write.userwritestage
        identifiers:
          name: default-source-enrollment-write
        attrs:
          user_creation_mode: always_create
          user_type: internal

  # Proxy provider + application for transcript.cowlab.org, plus its binding to
  # the forward-auth outpost.
  #
  # The outpost entry sets `providers` as a whole list, because a blueprint
  # writes attributes rather than merging them: include every provider the
  # outpost should keep. Adding a protected host anywhere else means adding its
  # provider here too, or the next blueprint apply drops it from the outpost.
  transcript.yaml: |
    version: 1
    metadata:
      name: Homelab - Transcript
    entries:
      - id: transcript-provider
        model: authentik_providers_proxy.proxyprovider
        identifiers:
          name: Transcript
        attrs:
          # forward_single: one host per provider, which is what the Traefik
          # forward-auth middleware expects (it sends X-Forwarded-Host and the
          # outpost matches it against external_host).
          mode: forward_single
          external_host: https://transcript.cowlab.org
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          # The same five mappings the other three providers carry: the three
          # OpenID claim mappings, entitlements, and the proxy outpost mapping.
          property_mappings:
            - !Find [authentik_core.propertymapping, [name, "authentik default OAuth Mapping: OpenID 'openid'"]]
            - !Find [authentik_core.propertymapping, [name, "authentik default OAuth Mapping: OpenID 'email'"]]
            - !Find [authentik_core.propertymapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]
            - !Find [authentik_core.propertymapping, [name, "authentik default OAuth Mapping: Application Entitlements"]]
            - !Find [authentik_core.propertymapping, [name, "authentik default OAuth Mapping: Proxy outpost"]]

      - id: transcript-application
        model: authentik_core.application
        identifiers:
          slug: transcript
        attrs:
          name: Transcript
          provider: !KeyOf transcript-provider
          policy_engine_mode: any

      - id: transcript-outpost
        model: authentik_outposts.outpost
        identifiers:
          name: traefik-forward-auth
        attrs:
          providers:
            - !Find [authentik_providers_proxy.proxyprovider, [name, Jellyseerr]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, Open WebUI]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, Copyparty]]
            - !KeyOf transcript-provider
