authentik:
  # Placeholders, not credentials. The real values come from Vaultwarden via the
  # ExternalSecret and are injected by kustomization.yaml as environment
  # variables, which take precedence over this chart-generated Secret. They must
  # still be non-empty here so the chart renders a valid Secret object.
  secret_key: "REPLACEME"

  error_reporting:
    enabled: false
    environment: "k8s"
    send_pii: false

  postgresql:
    host: "authentik-postgresql"
    name: "authentik"
    user: "authentik"
    password: "REPLACEME"
    port: 5432

  log_level: "info"

postgresql:
  enabled: true
  # Digest pin (spec 06 task 2.0). Tag path, because the postgres tag is an
  # explicit value here and the digest must sit alongside it.
  image:
    tag: 17.10-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
  auth:
    username: "authentik"
    password: "REPLACEME"
    # Without an explicit value the chart generates a random superuser password
    # on every render, so each regeneration would commit a new live credential to
    # this public repository. Pinned to a placeholder; kustomization.yaml points
    # the StatefulSet's credential volume at the ESO-managed Secret instead.
    postgresPassword: "REPLACEME"
    database: "authentik"
  primary:
    # The chart's own policy sets allowExternal: true, admitting 5432 from every
    # source. NetworkPolicy is additive, so leaving it enabled would reopen the
    # namespace despite the default-deny in networkpolicy.yaml.
    networkPolicy:
      enabled: false
    persistence:
      enabled: true
      storageClass: "longhorn"
      size: 8Gi

server:
  enabled: true
  replicas: 1

  ingress:
    enabled: false

  resources:
    requests:
      cpu: "100m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

worker:
  enabled: true
  replicas: 1

  resources:
    requests:
      cpu: "100m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

# Digest pin (spec 06 task 2.0). server and worker both default to
# global.image, so one override pins both workloads.
global:
  image:
    tag: 2026.5.6
    digest: sha256:ed120caf710ccf82ef0026f0bc74e51615bc95ebff228a7a2d6fc60c441c3868
