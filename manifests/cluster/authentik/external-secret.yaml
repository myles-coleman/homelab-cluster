apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: authentik-secrets
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-notes
  target:
    name: authentik-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        secret-key: '{{ .AUTHENTIK_SECRET_KEY }}'
        db-user: 'authentik'
        db-password: '{{ .AUTHENTIK_DB_PASSWORD }}'
        outpost-token: '{{ .AUTHENTIK_OUTPOST_TOKEN }}'
        # Read by the blueprint via !Env, never committed.
        google-client-id: '{{ .GOOGLE_OAUTH_CLIENT_ID }}'
        google-client-secret: '{{ .GOOGLE_OAUTH_CLIENT_SECRET }}'
  data:
    - secretKey: AUTHENTIK_SECRET_KEY
      remoteRef:
        key: ff428c63-e765-48e7-9e3f-160c51eb9a88
    - secretKey: AUTHENTIK_DB_PASSWORD
      remoteRef:
        key: 0e0e18f2-9b81-4501-a1f0-ac1b1afb41cd
    - secretKey: AUTHENTIK_OUTPOST_TOKEN
      remoteRef:
        key: a4a3a6e4-1307-4964-8c27-e40db002b7ce
    - secretKey: GOOGLE_OAUTH_CLIENT_ID
      remoteRef:
        key: f9b04b3f-3296-4c83-a376-ab626a33b5f9
    - secretKey: GOOGLE_OAUTH_CLIENT_SECRET
      remoteRef:
        key: 4389d900-bb5c-4e27-bf05-5e180d65f2e1
