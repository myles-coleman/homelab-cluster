apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: searxng
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng
  # The volumes this Deployment mounts are Longhorn ReadWriteOnce, so a new pod
  # cannot attach them while the old pod still holds them. maxSurge 0 terminates
  # the old pod first; maxUnavailable 1 allows that. `type: Recreate` would say
  # the same thing but is rejected by the API, because the live Deployment keeps
  # its default rollingUpdate fields and both cannot be set at once.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: searxng
    spec:
      nodeSelector:
        kubernetes.io/hostname: node1
      containers:
      - name: searxng
        image: searxng/searxng:2026.11.19-368baa340@sha256:5b72d7ef63a3d214c2a690016ecf53a17f1ab7f02dcc4a1de1669837d9340fc9
        env:
        - name: TZ
          value: "Etc/UTC"
        - name: PORT
          value: "8080"
        - name: SEARXNG_PORT
          value: "8080"
        - name: SEARXNG_SERVER__PORT
          value: "8080"
        - name: SEARXNG_SERVER__SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: searxng-secrets
              key: secret-key
        ports:
        - containerPort: 8080
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"
        volumeMounts:
        - name: config-volume
          mountPath: /etc/searxng
        - name: data-volume
          mountPath: /var/lib/searxng
      volumes:
      - name: config-volume
        configMap:
          name: searxng-config
      - name: data-volume
        persistentVolumeClaim:
          claimName: searxng-data
