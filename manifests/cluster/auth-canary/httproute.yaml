# Temporary canary route for spec 07. The forward-auth gate is added in task
# 4.1 for the first post-change login; here only the error-page middleware is
# present so the 403 replacement can be proven without touching a production
# host.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: auth-canary
  namespace: auth-canary
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - auth-canary.cowlab.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: authentik-error-page
      backendRefs:
        - group: ""
          kind: Service
          name: auth-canary
          port: 80
          weight: 1
