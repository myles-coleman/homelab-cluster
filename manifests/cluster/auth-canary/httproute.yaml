# Temporary canary route for spec 07. The error-page middleware wraps the
# forward-auth gate: it catches a 403 from the gate or the backend, while a 302
# from the gate passes through to login.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: auth-canary
  namespace: auth-canary
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - auth-canary.cowlab.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: authentik-error-page
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: authentik
      backendRefs:
        - group: ""
          kind: Service
          name: auth-canary
          port: 80
          weight: 1
