# Namespace-local copy of the canonical forward-auth gate.
#
# Temporary: the auth-canary host is removed in task 5.7.
#
# Traefik resolves an HTTPRoute's `ExtensionRef` in the route's own namespace,
# so this file must stay identical to
# `manifests/cluster/traefik/middleware-authentik.yaml` apart from
# `metadata.namespace`.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik
  namespace: auth-canary
spec:
  forwardAuth:
    address: http://authentik-outpost.authentik.svc.cluster.local:9000/outpost.goauthentik.io/auth/traefik
    authRequestHeaders:
      - Cookie
      - X-Forwarded-Method
      - X-Forwarded-Proto
      - X-Forwarded-Host
      - X-Forwarded-Uri
      - X-Forwarded-For
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
