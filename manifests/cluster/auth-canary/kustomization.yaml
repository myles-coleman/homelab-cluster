apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: auth-canary

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - middleware-auth-error-page.yaml
  - middleware-authentik.yaml
  - httproute.yaml
  - httproute-outpost.yaml

# Data-bearing objects cannot be pruned. See _prune-protection/.
components:
  - ../_prune-protection
