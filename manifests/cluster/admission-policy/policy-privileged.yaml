# Privileged containers are the strongest escape primitive available to a pod.
# This rule is the admission-time twin of the render-time privilege check, with
# one crucial difference: it matches Pods, so it also sees the sandbox pod that
# the agents.x-k8s.io controller creates from a Sandbox custom resource.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: deny-privileged
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
        scope: Namespaced
  matchConditions:
    # Exemptions are enumerated, one comment per entry, never a wildcard.
    - name: not-exempt
      expression: >-
        !(request.namespace in [
          "kube-system",
          "longhorn-system",
          "cert-manager"
        ])
  validations:
    - expression: >-
        !object.spec.containers.exists(c,
          has(c.securityContext) &&
          has(c.securityContext.privileged) &&
          c.securityContext.privileged) &&
        !(has(object.spec.initContainers) &&
          object.spec.initContainers.exists(c,
            has(c.securityContext) &&
            has(c.securityContext.privileged) &&
            c.securityContext.privileged)) &&
        !(has(object.spec.ephemeralContainers) &&
          object.spec.ephemeralContainers.exists(c,
            has(c.securityContext) &&
            has(c.securityContext.privileged) &&
            c.securityContext.privileged))
      message: >-
        privileged containers are not allowed in this namespace
        (ValidatingAdmissionPolicy deny-privileged)
