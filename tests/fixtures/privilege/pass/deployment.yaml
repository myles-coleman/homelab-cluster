apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixture
  namespace: fixture
spec:
  selector:
    matchLabels: {app: fixture}
  template:
    metadata:
      labels: {app: fixture}
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: app
          image: busybox:1.36@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          securityContext:
            allowPrivilegeEscalation: false
