apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyseerr
  namespace: jellyseerr
spec:
  hostnames:
  - jellyseerr.cowlab.org
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: traefik-gateway
    namespace: traefik
    sectionName: websecure
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: jellyseerr
      port: 5055
      weight: 1
    filters:
    - extensionRef:
        group: traefik.io
        kind: Middleware
        name: authentik
      type: ExtensionRef
    matches:
    - path:
        type: PathPrefix
        value: /
