apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/component: signoz
    app.kubernetes.io/instance: signoz
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: signoz
    app.kubernetes.io/version: v0.149.0
    helm.sh/chart: signoz-0.149.0
  name: signoz
  namespace: signoz
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: signoz
      app.kubernetes.io/instance: signoz
      app.kubernetes.io/name: signoz
  serviceName: signoz
  template:
    metadata:
      labels:
        app.kubernetes.io/component: signoz
        app.kubernetes.io/instance: signoz
        app.kubernetes.io/name: signoz
    spec:
      containers:
      - args: null
        env:
        - name: CLICKHOUSE_HOST
          value: signoz-clickhouse
        - name: CLICKHOUSE_PORT
          value: "9000"
        - name: CLICKHOUSE_HTTP_PORT
          value: "8123"
        - name: CLICKHOUSE_CLUSTER
          value: cluster
        - name: CLICKHOUSE_USER
          valueFrom:
            secretKeyRef:
              key: username
              name: signoz-clickhouse-admin
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: signoz-clickhouse-admin
        - name: CLICKHOUSE_SECURE
          value: "false"
        - name: SIGNOZ_TELEMETRYSTORE_PROVIDER
          value: clickhouse
        - name: SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN
          value: tcp://signoz-clickhouse:9000/?username=$(CLICKHOUSE_USER)&password=$(CLICKHOUSE_PASSWORD)
        - name: SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_CLUSTER
          value: cluster
        - name: SIGNOZ_PROMETHEUS_ACTIVE__QUERY__TRACKER_ENABLED
          value: "false"
        - name: SIGNOZ_ALERTMANAGER_SIGNOZ_EXTERNAL__URL
          value: http://localhost:8080
        - name: SIGNOZ_ALERTMANAGER_PROVIDER
          value: signoz
        - name: SIGNOZ_TOKENIZER_JWT_SECRET
          valueFrom:
            secretKeyRef:
              key: jwt-secret
              name: signoz-secrets
        image: docker.io/signoz/signoz:v0.149.0@sha256:dc31f487d69452b90da87cf7208b334963de776349b3c2b661bf88990edf9ca4
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 6
          httpGet:
            path: /api/v1/health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        name: signoz
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 8085
          name: http-internal
          protocol: TCP
        - containerPort: 4320
          name: opamp-internal
          protocol: TCP
        readinessProbe:
          failureThreshold: 6
          httpGet:
            path: /api/v1/health?live=1
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
        securityContext: {}
        volumeMounts:
        - mountPath: /var/lib/signoz/
          name: signoz-db
      priorityClassName: ""
      securityContext: {}
      serviceAccountName: signoz
      volumes:
      - emptyDir: {}
        name: dashboards
  volumeClaimTemplates:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: signoz-db
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
      storageClassName: longhorn
