apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: otel-collector
    app.kubernetes.io/instance: signoz
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: signoz
    app.kubernetes.io/version: v0.149.0
    helm.sh/chart: signoz-0.149.0
  name: signoz-otel-collector
  namespace: signoz
spec:
  minReadySeconds: 5
  progressDeadlineSeconds: 600
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: otel-collector
      app.kubernetes.io/instance: signoz
      app.kubernetes.io/name: signoz
  strategy:
    type: RollingUpdate
  template:
    metadata:
      annotations:
        checksum/config: f2fb31f477363b6f781ee6741e682665f0ee8ce028f3e12fc9bfa78bb41bbf36
        signoz.io/port: "8888"
        signoz.io/scrape: "true"
      labels:
        app.kubernetes.io/component: otel-collector
        app.kubernetes.io/instance: signoz
        app.kubernetes.io/name: signoz
    spec:
      containers:
      - args:
        - --config=/conf/otel-collector-config.yaml
        - --manager-config=/conf/otel-collector-opamp-config.yaml
        - --copy-path=/var/tmp/collector-config.yaml
        command:
        - /signoz-otel-collector
        env:
        - name: CLICKHOUSE_HOST
          value: signoz-clickhouse
        - name: CLICKHOUSE_PORT
          value: "9000"
        - name: CLICKHOUSE_HTTP_PORT
          value: "8123"
        - name: CLICKHOUSE_CLUSTER
          value: cluster
        - name: CLICKHOUSE_USER
          valueFrom:
            secretKeyRef:
              key: username
              name: signoz-clickhouse-admin
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: signoz-clickhouse-admin
        - name: CLICKHOUSE_SECURE
          value: "false"
        - name: CLICKHOUSE_DATABASE
          value: signoz_metrics
        - name: CLICKHOUSE_TRACE_DATABASE
          value: signoz_traces
        - name: CLICKHOUSE_LOG_DATABASE
          value: signoz_logs
        - name: CLICKHOUSE_METER_DATABASE
          value: signoz_meter
        - name: CLICKHOUSE_VERIFY
          value: "false"
        - name: K8S_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: K8S_POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: K8S_HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: K8S_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: K8S_POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: K8S_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: LOW_CARDINAL_EXCEPTION_GROUPING
          value: "false"
        - name: TENANT_ID
          valueFrom:
            secretKeyRef:
              key: tenant-id
              name: signoz-secrets
        image: docker.io/signoz/signoz-otel-collector:v0.144.15@sha256:3996e0ffc58bc86d433062a45ef7ff960a4768da0619944f651a17254d634daf
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 6
          httpGet:
            path: /
            port: 13133
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        name: collector
        ports:
        - containerPort: 14250
          name: jaeger-grpc
          protocol: TCP
        - containerPort: 14268
          name: jaeger-thrift
          protocol: TCP
        - containerPort: 8081
          name: logsheroku
          protocol: TCP
        - containerPort: 8082
          name: logsjson
          protocol: TCP
        - containerPort: 8888
          name: metrics
          protocol: TCP
        - containerPort: 4317
          name: otlp
          protocol: TCP
        - containerPort: 4318
          name: otlp-http
          protocol: TCP
        readinessProbe:
          failureThreshold: 6
          httpGet:
            path: /
            port: 13133
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 200Mi
        volumeMounts:
        - mountPath: /conf
          name: otel-collector-config-vol
      initContainers:
      - args:
        - migrate
        - sync
        - check
        command:
        - /signoz-otel-collector
        env:
        - name: CLICKHOUSE_HOST
          value: signoz-clickhouse
        - name: CLICKHOUSE_PORT
          value: "9000"
        - name: CLICKHOUSE_HTTP_PORT
          value: "8123"
        - name: CLICKHOUSE_CLUSTER
          value: cluster
        - name: CLICKHOUSE_USER
          valueFrom:
            secretKeyRef:
              key: username
              name: signoz-clickhouse-admin
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: signoz-clickhouse-admin
        - name: CLICKHOUSE_SECURE
          value: "false"
        - name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN
          value: tcp://$(CLICKHOUSE_USER):$(CLICKHOUSE_PASSWORD)@$(CLICKHOUSE_HOST):$(CLICKHOUSE_PORT)
        - name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER
          value: $(CLICKHOUSE_CLUSTER)
        - name: SIGNOZ_OTEL_COLLECTOR_TIMEOUT
          value: 10m
        - name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION
          value: "false"
        image: docker.io/signoz/signoz-otel-collector:v0.144.15@sha256:3996e0ffc58bc86d433062a45ef7ff960a4768da0619944f651a17254d634daf
        imagePullPolicy: IfNotPresent
        name: check
      priorityClassName: ""
      securityContext: {}
      serviceAccountName: signoz-otel-collector
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/component: otel-collector
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
      volumes:
      - configMap:
          name: signoz-otel-collector
        name: otel-collector-config-vol
