apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: otel-collector
    app.kubernetes.io/instance: signoz
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: signoz
    app.kubernetes.io/version: v0.149.0
    helm.sh/chart: signoz-0.149.0
  name: signoz-otel-collector
  namespace: signoz
spec:
  ports:
  - name: jaeger-grpc
    nodePort: null
    port: 14250
    protocol: TCP
    targetPort: jaeger-grpc
  - name: jaeger-thrift
    nodePort: null
    port: 14268
    protocol: TCP
    targetPort: jaeger-thrift
  - name: logsheroku
    nodePort: null
    port: 8081
    protocol: TCP
    targetPort: logsheroku
  - name: logsjson
    nodePort: null
    port: 8082
    protocol: TCP
    targetPort: logsjson
  - name: metrics
    nodePort: null
    port: 8888
    protocol: TCP
    targetPort: metrics
  - name: otlp
    nodePort: null
    port: 4317
    protocol: TCP
    targetPort: otlp
  - name: otlp-http
    nodePort: null
    port: 4318
    protocol: TCP
    targetPort: otlp-http
  selector:
    app.kubernetes.io/component: otel-collector
    app.kubernetes.io/instance: signoz
    app.kubernetes.io/name: signoz
  type: ClusterIP
