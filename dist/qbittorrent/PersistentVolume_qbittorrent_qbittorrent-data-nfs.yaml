apiVersion: v1
kind: PersistentVolume
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  name: qbittorrent-data-nfs
  namespace: qbittorrent
spec:
  accessModes:
  - ReadWriteMany
  capacity:
    storage: 1Ti
  mountOptions:
  - hard
  - nfsvers=4.1
  nfs:
    path: /mnt/md0/data
    server: 10.0.0.150
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs
