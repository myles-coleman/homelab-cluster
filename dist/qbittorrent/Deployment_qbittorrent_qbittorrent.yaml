apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: qbittorrent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qbittorrent
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: TZ
          value: America/Los_Angeles
        - name: WEBUI_PORT
          value: "8080"
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        image: lscr.io/linuxserver/qbittorrent:version-5.3.0_v2.1.2@sha256:3d4c4545d51a690a0df15a2ff99038823a88a9822df8e794526447b9afbd7384
        name: qbittorrent
        ports:
        - containerPort: 8080
          name: webui
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 512Mi
        startupProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - |
              # Wait for the sidecar to bring tailscale0 up with an address.
              ip link show tailscale0 | grep -q "LOWER_UP" && \
              ip addr show tailscale0 | grep -q "inet" || exit 1
          failureThreshold: 60
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
        volumeMounts:
        - mountPath: /config
          name: config-volume
        - mountPath: /data
          name: data-nfs-volume
      initContainers:
      - command:
        - /bin/sh
        - -c
        - |
          set -eu
          # The image's `iptables` symlink points at the legacy backend, which
          # the nodes' nftables-only kernel rejects. Use the nft backend.
          IPT=iptables-nft
          IP6T=ip6tables-nft
          command -v "$IPT" >/dev/null 2>&1 || IPT=iptables
          command -v "$IP6T" >/dev/null 2>&1 || IP6T=ip6tables
          "$IPT" -A OUTPUT -o lo -j ACCEPT
          "$IPT" -A OUTPUT -o tailscale0 -j ACCEPT
          "$IPT" -A OUTPUT -d 10.42.0.0/16 -j ACCEPT
          "$IPT" -A OUTPUT -d 10.43.0.0/16 -j ACCEPT
          "$IPT" -A OUTPUT -m owner --uid-owner 0 -j ACCEPT
          "$IPT" -A OUTPUT -j DROP
          if [ -d /proc/sys/net/ipv6 ]; then
            "$IP6T" -A OUTPUT -o lo -j ACCEPT
            "$IP6T" -A OUTPUT -o tailscale0 -j ACCEPT
            "$IP6T" -A OUTPUT -m owner --uid-owner 0 -j ACCEPT
            "$IP6T" -A OUTPUT -j DROP
          fi
        image: tailscale/tailscale:stable@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
        name: killswitch
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 25m
            memory: 16Mi
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
      - env:
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef:
              key: authkey
              name: tailscale-auth
        - name: TS_KUBE_SECRET
          value: ""
        - name: TS_STATE_DIR
          value: /var/lib/tailscale
        - name: TS_USERSPACE
          value: "false"
        - name: TS_ACCEPT_DNS
          value: "true"
        - name: TS_HOSTNAME
          value: qbittorrent-egress
        - name: TS_EXTRA_ARGS
          value: --exit-node=100.112.185.27 --exit-node-allow-lan-access
        image: tailscale/tailscale:stable@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
        name: tailscale
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - tailscale status --json | grep -Eq '"BackendState":[[:space:]]*"Running"'
          periodSeconds: 10
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        restartPolicy: Always
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
        startupProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - tailscale status --json | grep -Eq '"BackendState":[[:space:]]*"Running"'
          failureThreshold: 60
          periodSeconds: 5
        volumeMounts:
        - mountPath: /var/lib/tailscale
          name: tailscale-state
        - mountPath: /dev/net/tun
          name: dev-net-tun
      volumes:
      - name: config-volume
        persistentVolumeClaim:
          claimName: qbittorrent-config
      - name: data-nfs-volume
        persistentVolumeClaim:
          claimName: qbittorrent-data-nfs
      - name: tailscale-state
        persistentVolumeClaim:
          claimName: qbittorrent-tailscale-state
      - hostPath:
          path: /dev/net/tun
          type: CharDevice
        name: dev-net-tun
