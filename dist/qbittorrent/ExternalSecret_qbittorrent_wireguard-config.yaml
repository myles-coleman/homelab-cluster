apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: wireguard-config
  namespace: qbittorrent
spec:
  data:
  - remoteRef:
      key: 08101098-e81a-4641-9411-1957c2510c92
    secretKey: wgconfig
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-notes
  target:
    creationPolicy: Owner
    name: wireguard-config
    template:
      data:
        wg0.conf: '{{ .wgconfig }}'
      engineVersion: v2
