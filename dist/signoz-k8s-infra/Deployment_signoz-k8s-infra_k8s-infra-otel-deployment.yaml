apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: otel-deployment
    app.kubernetes.io/instance: k8s-infra
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: k8s-infra
    app.kubernetes.io/version: 0.139.0
    helm.sh/chart: k8s-infra-0.17.1
  name: k8s-infra-otel-deployment
  namespace: signoz-k8s-infra
spec:
  minReadySeconds: 5
  progressDeadlineSeconds: 120
  replicas: null
  selector:
    matchLabels:
      app.kubernetes.io/component: otel-deployment
      app.kubernetes.io/instance: k8s-infra
      app.kubernetes.io/name: k8s-infra
  strategy:
    type: RollingUpdate
  template:
    metadata:
      annotations:
        checksum/config: 3246e7c63b54e5e1692fe78c55e0df409757ec95f5c23f4f0cbd2f58376726ac
      labels:
        app.kubernetes.io/component: otel-deployment
        app.kubernetes.io/instance: k8s-infra
        app.kubernetes.io/name: k8s-infra
    spec:
      containers:
      - args:
        - --config=/conf/otel-deployment-config.yaml
        command:
        - /otelcol-contrib
        env:
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://signoz-otel-collector.signoz.svc.cluster.local:4318
        - name: OTEL_SECRETS_PATH
          value: /secrets
        - name: K8S_CLUSTER_NAME
          value: homelab-cluster
        - name: K8S_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: K8S_POD_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIP
        - name: K8S_HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: K8S_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: K8S_POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: K8S_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: SIGNOZ_COMPONENT
          value: otel-deployment
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: signoz.component=$(SIGNOZ_COMPONENT),k8s.cluster.name=$(K8S_CLUSTER_NAME)
        image: docker.io/otel/opentelemetry-collector-contrib:0.139.0@sha256:faf125d656fa47cea568b2f3b4494efd2525083bc75c1e96038bc23f05cd68fd
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 6
          httpGet:
            path: /
            port: 13133
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        name: k8s-infra-otel-deployment
        ports:
        - containerPort: 13133
          name: health-check
          protocol: TCP
        readinessProbe:
          failureThreshold: 6
          httpGet:
            path: /
            port: 13133
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 100Mi
        securityContext: {}
        volumeMounts:
        - mountPath: /conf
          name: otel-deployment-config-vol
      priorityClassName: ""
      securityContext: {}
      serviceAccountName: k8s-infra-otel-deployment
      volumes:
      - configMap:
          name: k8s-infra-otel-deployment
        name: otel-deployment-config-vol
