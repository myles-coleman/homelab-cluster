apiVersion: apps/v1
kind: Deployment
metadata:
  name: youtubedl-material
  namespace: youtubedl-material
spec:
  replicas: 1
  selector:
    matchLabels:
      app: youtubedl-material
  template:
    metadata:
      labels:
        app: youtubedl-material
    spec:
      containers:
      - env:
        - name: ytdl_mongodb_connection_string
          value: mongodb://ytdl-mongo-db:27017
        - name: ytdl_use_local_db
          value: "false"
        - name: ytdl_remote_db_type
          value: mongo
        - name: write_ytdl_config
          value: "true"
        image: voc0der/ytdl-material@sha256:7ce087dc5d07071fac9d2e37b6f63c26a14506a3445f17fdef918b0063c02515
        name: youtubedl-material
        ports:
        - containerPort: 17442
        resources:
          limits:
            cpu: 1000m
            memory: 2048Mi
          requests:
            cpu: 500m
            memory: 1024Mi
        volumeMounts:
        - mountPath: /app/appdata
          name: appdata
        - mountPath: /app/audio
          name: audio
        - mountPath: /app/video
          name: video
        - mountPath: /app/subscriptions
          name: subscriptions
        - mountPath: /app/users
          name: users
      volumes:
      - name: appdata
        persistentVolumeClaim:
          claimName: ytdl-appdata
      - name: audio
        persistentVolumeClaim:
          claimName: ytdl-audio
      - name: video
        persistentVolumeClaim:
          claimName: ytdl-video
      - name: subscriptions
        persistentVolumeClaim:
          claimName: ytdl-subscriptions
      - name: users
        persistentVolumeClaim:
          claimName: ytdl-users
