apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ai-artifacts-site-ghcr
  namespace: ai-artifacts-site
spec:
  data:
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: 4a9d9524-b080-409a-8ec0-c2623f2c33c9
      metadataPolicy: None
      property: username
    secretKey: username
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: 4a9d9524-b080-409a-8ec0-c2623f2c33c9
      metadataPolicy: None
      property: password
    secretKey: password
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: ai-artifacts-site-ghcr
    template:
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/dockerconfigjson
