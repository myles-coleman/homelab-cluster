apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: bitwarden-cli
    app.kubernetes.io/name: bitwarden-cli
  name: bitwarden-cli
  namespace: external-secrets
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: bitwarden-cli
      app.kubernetes.io/name: bitwarden-cli
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: bitwarden-cli
        app.kubernetes.io/name: bitwarden-cli
    spec:
      containers:
      - env:
        - name: BW_HOST
          value: https://vaultwarden.cowlab.org
        - name: BW_CLIENTID
          valueFrom:
            secretKeyRef:
              key: BW_CLIENTID
              name: bitwarden-cli
        - name: BW_CLIENTSECRET
          valueFrom:
            secretKeyRef:
              key: BW_CLIENTSECRET
              name: bitwarden-cli
        - name: BW_PASSWORD
          valueFrom:
            secretKeyRef:
              key: BW_PASSWORD
              name: bitwarden-cli
        image: beebecomebigbee/bitwarden-cli@sha256:7b4f20b43564548745a68259d57e9ade2c720f20d295b7b20eb9269b166986ca
        imagePullPolicy: IfNotPresent
        name: bitwarden-cli
        ports:
        - containerPort: 8087
          name: http
          protocol: TCP
