apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  labels:
    app.kubernetes.io/part-of: agent-broker
  name: github-app
  namespace: agent-publisher
spec:
  data:
  - remoteRef:
      key: 4a22ef3b-312b-4624-8e64-9a3060579091
    secretKey: app-id
  - remoteRef:
      key: cd9b8bf5-76c3-4cba-a0d0-d454223b1337
    secretKey: private-key.pem
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-notes
  target:
    creationPolicy: Owner
    name: github-app
