apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opencode-sandbox-ingress
  namespace: agent-sandbox
spec:
  ingress:
  - from:
    - ipBlock:
        cidr: 10.0.0.146/32
    ports:
    - port: 4096
      protocol: TCP
  podSelector:
    matchLabels:
      app: opencode-sandbox
  policyTypes:
  - Ingress
