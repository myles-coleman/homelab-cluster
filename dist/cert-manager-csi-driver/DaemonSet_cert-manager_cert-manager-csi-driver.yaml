apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/instance: cert-manager-csi-driver
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: cert-manager-csi-driver
    app.kubernetes.io/version: v0.16.1
    helm.sh/chart: cert-manager-csi-driver-v0.16.1
  name: cert-manager-csi-driver
  namespace: cert-manager
spec:
  selector:
    matchLabels:
      app: cert-manager-csi-driver
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: cert-manager-csi-driver
      labels:
        app: cert-manager-csi-driver
        app.kubernetes.io/instance: cert-manager-csi-driver
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: cert-manager-csi-driver
        app.kubernetes.io/version: v0.16.1
        helm.sh/chart: cert-manager-csi-driver-v0.16.1
    spec:
      containers:
      - args:
        - -v=1
        - --csi-address=/plugin/csi.sock
        - --kubelet-registration-path=/var/lib/kubelet/plugins/cert-manager-csi-driver/csi.sock
        env:
        - name: KUBE_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        image: quay.io/jetstack/csi-node-driver-registrar:v2.18.0@sha256:b7fefd08651f00ac4df1a196ed4c621c2451fbb899297fe9fad9e36c667af0c0
        imagePullPolicy: IfNotPresent
        name: node-driver-registrar
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsUser: 0
        volumeMounts:
        - mountPath: /plugin
          name: plugin-dir
        - mountPath: /registration
          name: registration-dir
      - args:
        - --csi-address=/plugin/csi.sock
        - --probe-timeout=3s
        - --health-port=9809
        - -v=1
        image: quay.io/jetstack/livenessprobe:v2.20.0@sha256:19f2cf2f40e1987c7943945deca5f65cd4e4bf5cc0657fc78a5df131861578e8
        imagePullPolicy: IfNotPresent
        name: liveness-probe
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsUser: 0
        volumeMounts:
        - mountPath: /plugin
          name: plugin-dir
      - args:
        - --log-level=1
        - --driver-name=csi.cert-manager.io
        - --node-id=$(NODE_ID)
        - --endpoint=$(CSI_ENDPOINT)
        - --data-root=csi-data-dir
        - --use-token-request=false
        - --continue-on-not-ready=false
        - --kube-api-qps=0
        - --kube-api-burst=0
        - --metrics-bind-address=:9402
        env:
        - name: NODE_ID
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: CSI_ENDPOINT
          value: unix://plugin/csi.sock
        image: quay.io/jetstack/cert-manager-csi-driver:v0.16.1@sha256:00493ba0324911cd93db80e9012076931053100b4d53bedd5fb574fc4c6aca8b
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: healthz
          initialDelaySeconds: 5
          timeoutSeconds: 5
        name: cert-manager-csi-driver
        ports:
        - containerPort: 9809
          name: healthz
        - containerPort: 9402
          name: http-metrics
        securityContext:
          capabilities:
            drop:
            - ALL
          privileged: true
          readOnlyRootFilesystem: true
          runAsUser: 0
        volumeMounts:
        - mountPath: /plugin
          name: plugin-dir
        - mountPath: /var/lib/kubelet/pods
          mountPropagation: Bidirectional
          name: pods-mount-dir
        - mountPath: /csi-data-dir
          mountPropagation: Bidirectional
          name: csi-data-dir
      hostNetwork: false
      nodeSelector:
        kubernetes.io/os: linux
        sandbox.node/runtime: gvisor
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: cert-manager-csi-driver
      tolerations:
      - effect: NoSchedule
        key: sandbox
        operator: Equal
        value: gvisor
      volumes:
      - hostPath:
          path: /var/lib/kubelet/plugins/cert-manager-csi-driver
          type: DirectoryOrCreate
        name: plugin-dir
      - hostPath:
          path: /var/lib/kubelet/pods
          type: Directory
        name: pods-mount-dir
      - hostPath:
          path: /var/lib/kubelet/plugins_registry
          type: Directory
        name: registration-dir
      - hostPath:
          path: /tmp/cert-manager-csi-driver
          type: DirectoryOrCreate
        name: csi-data-dir
