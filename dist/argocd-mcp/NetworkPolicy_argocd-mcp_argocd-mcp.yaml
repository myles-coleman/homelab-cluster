apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: argocd-mcp
  namespace: argocd-mcp
spec:
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  - ports:
    - port: 8080
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: argocd
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
    ports:
    - port: 3000
      protocol: TCP
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: open-webui
    ports:
    - port: 3000
      protocol: TCP
  podSelector:
    matchLabels:
      app: argocd-mcp
  policyTypes:
  - Ingress
  - Egress
